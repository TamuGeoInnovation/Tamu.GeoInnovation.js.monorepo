# Code Maroon feed, proxied so the browser can read it (#1289).
#
# The feed sends no Access-Control-Allow-Origin, so a page on this origin cannot fetch it directly.
# Proxying it to a path on this origin is the whole of the fix - no new service, and it ships with
# this image.
#
# The 15 second cache is the part that matters to Emergency Operations: every visitor's map reads
# from here rather than from codemaroon.tamu.edu, so the request rate we put on their system is
# fixed at about four a minute however many people have a map open. It does not grow during an
# emergency, which is when it must not.
proxy_cache_path /var/cache/nginx/code-maroon levels=1:2 keys_zone=code_maroon:1m max_size=10m inactive=5m use_temp_path=off;

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Cache static assets with hash-based names (e.g., main.abc123.js)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache index.html - always serve fresh for cache-busting
    location = /index.html {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    # See the cache zone above for why this exists.
    location = /code-maroon/feed.xml {
        proxy_pass https://codemaroon.tamu.edu/feed.xml;
        proxy_set_header Host codemaroon.tamu.edu;
        # Cloudflare fronts the feed, so the handshake needs SNI or it is refused.
        proxy_ssl_server_name on;
        proxy_http_version 1.1;

        proxy_cache code_maroon;
        proxy_cache_valid 200 15s;
        # The upstream sets a session cookie on every response, and nginx will not cache a
        # response carrying Set-Cookie unless told to disregard it. Without this the cache never
        # holds anything and every visitor's poll reaches Code Maroon, which is the opposite of
        # the point. Verified: without it every request logs MISS.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        # An emergency map that says nothing because the feed hiccuped is the worst outcome, so a
        # stale answer is served while a fresh one is fetched, and if the upstream is failing.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # One request upstream when several arrive at once, rather than one each.
        proxy_cache_lock on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        # The upstream sets session cookies. They are nothing to do with this page and should not
        # reach the browser.
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Powered-By;

        add_header X-Code-Maroon-Cache $upstream_cache_status always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # Route all requests to index.html for an SPA
        try_files $uri $uri/ /index.html;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}