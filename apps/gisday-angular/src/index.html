<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Each site's name, description and link-preview image go between these comments when the app is built, from
      libs/gisday/common/src/lib/sites.ts, one page per site (index.<site>.html), and the site's server picks the page by
      address (#2649). What is here is txgisday.org's, for the dev server.
    -->
    <!-- site head -->
    <title>TxGIS Day</title>
    <meta name="description" content="Three days of workshops and programs celebrating geospatial technology dedicated to students and faculty as they educate, innovate, and collaborate." />
    <!-- /site head -->
    <meta name="keywords" content="event, details, agenda, schedule" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <base href="/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <tamu-gisc-root></tamu-gisc-root>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=___G_TAG___"></script>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', '___G_TAG___');
    </script>
  </body>
</html>
