<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Each site's name, description and link-preview image go between these comments when the app is built, from
      libs/gisday/common/src/lib/sites.ts, one page per site (index.<site>.html), and the site's server picks the page by
      address (#2649). What is here is txgisday.org's, for the dev server.
    -->
    <!-- site head -->
    <title>TxGIS Day</title>
    <link rel="icon" href="favicon.ico" />
    <meta name="description" content="Three days of workshops and programs celebrating geospatial technology dedicated to students and faculty as they educate, innovate, and collaborate." />
    <!-- /site head -->
    <meta name="keywords" content="event, details, agenda, schedule" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <tamu-gisc-root></tamu-gisc-root>

    <!-- A session's check-in code (#2572). Its QR code opens the check-in page with the code in the address, and Google
         Analytics reports the address it finds, so the code comes out of it here, before the tag below is configured and
         before the app starts. It also leaves the browser's history, and any link copied from the address bar. The
         check-in page reads it back from this tab's storage, under its own address (CHECK_IN_CODE_KEPT). -->
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var code = params.get('checkin');

        if (code === null) {
          return;
        }

        try {
          sessionStorage.setItem('gisday-checkin-code:' + location.pathname, code);
        } catch (e) {
          // Storage refused: the check-in page says the link has no code, and to scan it again.
        }

        params.delete('checkin');

        var search = params.toString();

        history.replaceState(history.state, '', location.pathname + (search ? '?' + search : '') + location.hash);
      })();
    </script>

    <!-- Google tag (gtag.js). The container fills in G_TAG when it starts, but leaves the placeholder when G_TAG is empty, as
         on a site with no Analytics property yet (gisday.ucgis.org), so the tag is loaded only for a real ID (#2657). gtag
         is defined either way, so anything that calls it does not fail. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      window.gtag = gtag;

      (function (id) {
        if (!id || id.indexOf('___') === 0) {
          return;
        }

        var tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(tag);

        gtag('js', new Date());
        gtag('config', id);
      })('___G_TAG___');
    </script>
  </body>
</html>
