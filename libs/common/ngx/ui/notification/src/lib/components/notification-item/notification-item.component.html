<div [@animate]="animateStatus()" (mouseenter)="pause()" (mouseleave)="resume()" (focusin)="pause()" (focusout)="resume()">
  <div class="status" [style.width.%]="(timer.current() / timer.limit) * 100"></div>
  <div class="content" [attr.tabindex]="notification().action ? 0 : null" [attr.role]="notification().action ? 'button' : null" (click)="action()" (keydown.enter)="action()" (keydown.space)="action(); $event.preventDefault()" [class.actionable]="notification().action">
    <div>
      <div class="image">
        <img [src]="notification().imgUrl" [title]="notification().imgAltText" [alt]="notification().imgAltText" />
      </div>
    </div>
    <div>
      <div class="title">{{ notification().title }}</div>
      <div class="description" [innerHTML]="notification().message">This is a test <i class="material-icons">directions</i></div>
      @if (notification().acknowledge) {
      <div class="acknowledgment-actions">
        <a href="#" class="dont-show-again" (click)="acknowledge(); $event.preventDefault(); $event.stopPropagation();" title="Don't show this notification again">[ Don't show again ]</a>
      </div>
      }
    </div>
  </div>
  <div class="close material-icons" title="Close" aria-label="Close" tabindex="0" role="button" (click)="close()" (keydown.enter)="close()" (keydown.space)="close(); $event.preventDefault()">close</div>
</div>
