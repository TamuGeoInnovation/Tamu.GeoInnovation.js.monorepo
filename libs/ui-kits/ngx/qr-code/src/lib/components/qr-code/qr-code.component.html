<svg class="qr-code" role="img" [attr.aria-label]="label()" [attr.viewBox]="'0 0 ' + modules().size + ' ' + modules().size" shape-rendering="crispEdges">
  <rect [attr.width]="modules().size" [attr.height]="modules().size" fill="#ffffff"></rect>
  <path [attr.d]="path()" fill="#000000"></path>
</svg>

@if (isFullscreen()) { @if (caption()) {
<p class="qr-caption">{{ caption() }}</p>
}
<tamu-gisc-button class="qr-exit" value="Exit full screen" look="secondary" fit="snug" (go)="exitFullscreen()"></tamu-gisc-button>
} @else if (downloadName() || fullscreen()) {
<div class="qr-actions leader-1">
  @if (fullscreen()) {
  <tamu-gisc-button value="Full screen" look="secondary" fit="snug" (go)="enterFullscreen()"></tamu-gisc-button>
  } @if (downloadName()) {
  <tamu-gisc-button value="Download PNG" look="secondary" fit="snug" (go)="download()"></tamu-gisc-button>
  }
</div>
}
