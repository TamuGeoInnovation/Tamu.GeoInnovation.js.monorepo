<!-- A mouse shortcut only: Escape and the close button below do the same from the keyboard. -->
<div class="modal--overlay" role="presentation" (click)="cancelModal()"></div>

<div class="modal--container">
  <header>
    <div class="modal--header-action">
      <span class="material-icons" title="Close" alt="Close window" role="button" aria-label="Close window" (click)="cancelModal()" (keyup.space)="cancelModal()" (keyup.enter)="cancelModal()" tabindex="0">cancel</span>
    </div>
  </header>

  <div class="modal--body">
    <ng-template #modal></ng-template>
  </div>
</div>
