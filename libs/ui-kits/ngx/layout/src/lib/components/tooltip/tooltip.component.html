<ng-content select="tamu-gisc-tooltip-trigger"></ng-content>

@if (isVisible) {
<div class="tooltip-container {{position}}" [ngStyle]="{'left.px': $safeNavigationMigration((containerPosition | async)?.x), 'top.px': $safeNavigationMigration((containerPosition | async)?.y), width: width, position: positioningStrategy, maxHeight: height}" [ngClass]="{visible: tooltipContentVisible | async}" #tooltipContainer>
  <ng-content></ng-content>
</div>
}
