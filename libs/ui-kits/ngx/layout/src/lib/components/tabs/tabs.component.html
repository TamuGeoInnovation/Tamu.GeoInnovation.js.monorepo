<div class="tabs" role="tablist">
  @for (toggle of toggles; track toggle) {
  <div class="tab" role="tab" tabindex="0" [attr.aria-selected]="toggle.index === toggleIndex()" (click)="swapContent(toggle)" (keydown.enter)="swapContent(toggle)" (keydown.space)="swapContent(toggle); $event.preventDefault()" [ngClass]="{ active: toggle.index === toggleIndex() }">
    <p>{{ toggle.label }}</p>
  </div>
  }
</div>

<div class="content" [ngClass]="{forwards: contentDirection() === 'forwards', reverse: contentDirection() === 'reverse'}">
  <ng-container [ngTemplateOutlet]="toggles[toggleIndex()].template"></ng-container>
</div>
