<div class="menu">
  <ng-content select=".drawer-menu"></ng-content>
</div>

<div class="content">
  <ng-content select=".content"></ng-content>
</div>

<div class="toggle material-icons" (click)="toggleVisibility()" [ngClass]="{ visible: visible }">
  @if (position === 'left') {
  <span>chevron_right</span>
  } @if (position === 'right') {
  <span>chevron_left</span>
  }
</div>
