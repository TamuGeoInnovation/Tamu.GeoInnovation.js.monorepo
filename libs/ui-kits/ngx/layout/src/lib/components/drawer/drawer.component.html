<div class="menu">
  <ng-content select=".drawer-menu"></ng-content>
</div>

<div class="content">
  <ng-content select=".content"></ng-content>
</div>

<div class="toggle material-icons" [attr.aria-expanded]="visible()" [attr.aria-label]="visible() ? 'Hide panel' : 'Show panel'" tabindex="0" role="button" (click)="toggleVisibility()" (keydown.enter)="toggleVisibility()" (keydown.space)="toggleVisibility(); $event.preventDefault()" [ngClass]="{ visible: visible() }">
  @if (position() === 'left') {
  <span>chevron_right</span>
  } @if (position() === 'right') {
  <span>chevron_left</span>
  }
</div>
