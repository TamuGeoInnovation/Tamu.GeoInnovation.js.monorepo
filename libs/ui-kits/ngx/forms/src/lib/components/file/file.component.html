<div class="icon">
  <span class="material-icons">attach_file</span>
</div>

@if (fileName === undefined) {
<div class="placeholder">
  <ng-content></ng-content>
</div>
} @else {
<p>{{fileName}}</p>
<p class="inline-link" tabindex="0" role="button" (click)="reset()" (keydown.enter)="reset()" (keydown.space)="reset(); $event.preventDefault()">{{clearMessage()}}</p>
}

<input type="file" [accept]="accept()" (change)="handleFileChange($event)" />
