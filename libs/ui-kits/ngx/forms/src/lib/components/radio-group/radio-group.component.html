@for (option of options; track option) {
  <div class="radio-option" (click)="evaluateSetValue(option)" [ngClass]="{disabled: disabled}">
    <div class="radio-toggle">
      @switch (renderTemplate(option, valuePath) === value) {
        @case (true) {
          <div class="material-icons active">radio_button_checked</div>
        }
        @default {
          <div class="material-icons">radio_button_unchecked</div>
        }
      }
    </div>
    <p class="radio-label">{{renderTemplate(option, displayPath)}}</p>
  </div>
}
