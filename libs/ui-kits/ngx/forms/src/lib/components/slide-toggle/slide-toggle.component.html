<div class="toggle-track">
  @if ((activeDimensions$ | async) !== null) {
  <div class="toggle-highlighter" [style.minWidth.px]="(activeDimensions$ | async)?.width" [style.transform]="'translateX('+ (activeDimensions$ | async)?.translate + 'px)'"></div>
  } @for (option of options(); track option) {
  <div class="toggle-option" #toggleOption role="radio" [attr.aria-checked]="renderTemplate(option, valuePath()) === value" [attr.aria-disabled]="disabled()" tabindex="0" (click)="evaluateSetValue(option)" (keydown.enter)="evaluateSetValue(option)" (keydown.space)="evaluateSetValue(option); $event.preventDefault()" [ngClass]="{disabled: disabled()}" [attr.attr-value]="renderTemplate(option, valuePath())">
    <p class="toggle-label" [ngClass]="{active: (renderTemplate(option, valuePath()) === value)}">{{renderTemplate(option, displayPath())}}</p>
  </div>
  }
</div>
