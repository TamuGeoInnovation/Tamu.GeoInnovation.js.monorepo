<div class="popup-section">
  <div class="feature-style-1" tabindex="0" [title]="title">{{ title }}</div>
</div>

<div class="popup-section" *ngIf="data?.attributes?.description">
  <p class="trailer-1" *ngIf="data?.attributes?.description" [innerHTML]="data.attributes?.description"></p>
</div>

<div class="popup-section" *ngIf="shareUrl">
  <tamu-gisc-copy-field [text]="shareUrl"></tamu-gisc-copy-field>
</div>
