<div class="popup-section">
  <div class="feature-style-1" tabindex="0" [title]="title">{{ title }}</div>
</div>

@if (isContentLengthZero === false) {
  <div class="popup-section">
    @if (isContentLengthZero === false) {
      <p class="trailer-1" [innerHTML]="data.attributes?.description"></p>
    }
  </div>
}

<div class="popup-section">
  @if (shareUrl) {
    <tamu-gisc-copy-field [text]="shareUrl"></tamu-gisc-copy-field>
  }

  @if (directionsAvailable | async) {
    <div class="button" tabindex="0" role="button" (click)="startDirections()">Directions To Here</div>
  }
</div>
