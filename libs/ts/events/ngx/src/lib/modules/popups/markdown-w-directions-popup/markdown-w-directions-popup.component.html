<div class="popup-section">
  <div class="feature-style-1" tabindex="0" [title]="title">{{ title }}</div>
</div>

<div class="popup-section">
  <p class="trailer-1" *ngIf="hasDescription" [innerHTML]="data.attributes?.description"></p>
  <div class="popup-markdown trailer-1" *ngIf="additionalContent" [innerHTML]="additionalContent | markdownParse"></div>

  <div class="button" tabindex="0" role="button" (click)="startDirections()">Directions To Here</div>
</div>
