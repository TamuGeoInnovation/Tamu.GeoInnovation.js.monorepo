<tamu-gisc-search [placeholder]="'Find Building or Parking'" [leftActionIcon]="'search'" [rightActionIcon]="'close'" (result)="onSearchResult($event)"></tamu-gisc-search>

<div *ngIf="hasSettings" class="leader-1">
  <div class="sidebar-component-name">
    <p>Share Map</p>
  </div>

  <div class="sidebar-component-content-container">
    <p>Make coordination easy! The following link can be shared with friends and family to load your configured map.</p>

    <ul class="settings-list">
      <li *ngFor="let pair of mergedSettings | keyvalue">
        <strong>{{ pair.value.shortDescription }}: {{ pair.value.option?.label }}</strong>
        <p *ngIf="pair.value.option?.note" class="setting-note">{{ pair.value.option?.note }}</p>
      </li>
    </ul>

    <tamu-gisc-copy-field [text]="shareUrl"></tamu-gisc-copy-field>

    <p class="settings-edit"><a href="javascript:void(0)" (click)="navigateSettingsReview()">Change {{configuration?.shortApplicationName}} Settings</a></p>
  </div>
</div>

<tamu-gisc-legend
  [deduplicate]="true"
  [respectDefinitionExpression]="true"
  [allowVisibilityToggle]="legendAllowVisibilityToggle"
  [combineChildrenUnderPrimary]="legendCombineChildrenUnderPrimary"
  [excludedLayerIds]="legendExcludedLayerIds"
></tamu-gisc-legend>

<tamu-gisc-layer-list></tamu-gisc-layer-list>
