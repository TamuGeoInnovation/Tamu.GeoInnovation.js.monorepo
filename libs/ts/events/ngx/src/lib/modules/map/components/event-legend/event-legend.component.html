@if (sidebarInfo; as info) {
  @for (section of info.sections; track section) {
    <div class="sidebar-info-section">
      <div class="sidebar-component-name">
        <p [ngStyle]="section.styleOverrides?.heading">{{ section.heading }}</p>
      </div>
      @if (section.subheading) {
        <p class="sidebar-info-subheading" [ngStyle]="section.styleOverrides?.subheading">{{ section.subheading }}</p>
      }
      @if (section.items?.length) {
        <ul class="sidebar-info-items" [ngStyle]="section.styleOverrides?.items">
          @for (item of section.items; track item) {
            <li [ngStyle]="section.styleOverrides?.item">{{ item }}</li>
          }
        </ul>
      }
    </div>
  }
}

<tamu-gisc-legend
  [deduplicate]="deduplicate"
  [respectDefinitionExpression]="respectDefinitionExpression"
  [allowVisibilityToggle]="allowVisibilityToggle"
  [combineChildrenUnderPrimary]="combineChildrenUnderPrimary"
></tamu-gisc-legend>
