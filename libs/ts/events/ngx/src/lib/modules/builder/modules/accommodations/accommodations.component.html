<div class="container12">
  <ng-container *ngIf="accommodation$ | async as accommodation">
    <p class="center-text component-instructions">{{accommodation.description}}</p>

    <div class="options-container">
      <div *ngFor="let option of accommodation.choices" (click)="saveOption(accommodation.value, option.value)" (keyup.space)="saveOption(accommodation.value, option.value)" (keyup.enter)="saveOption(accommodation.value, option.value)" class="button terciary" [ngClass]="{'active': (savedOptionValue | async) === option.value}" tabindex="0">{{option.label}}</div>
    </div>
  </ng-container>
</div>
