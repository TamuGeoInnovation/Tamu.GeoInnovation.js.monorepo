<div class="container12">
  <p class="trailer-2 center-text component-instructions">Please review that your selections are correct. In doing so, you'll receive the best parking locations and avoid parking citations.</p>

  <div class="flex flex-row justify-center">
    <div class="column6 flex flex-column" id="settings-table">
      <div class="setting-item"></div>

      <div class="setting-item" *ngFor="let option of mergedSettings | keyvalue">
        <div>{{option.value.shortDescription}}</div>
        <div>
          <p *ngIf="option.value.option === null">Not Set</p>
          <p *ngIf="option.value.option !== null">{{ option.value.option.label }}</p>
          <a [routerLink]="['/builder/accommodations', option.key]" [queryParams]="{ret: 'review'}">Change</a>
        </div>
      </div>

      <ng-container *ngIf="settingsValid; else infoTemplate">
        <tamu-gisc-button value="Take Me To My Map" (go)="next('map')"></tamu-gisc-button>
      </ng-container>

      <ng-template #infoTemplate>
        <p>Please ensure that all selections are set before proceeding.</p>
      </ng-template>
    </div>
  </div>
</div>
