<div class="popup-section">
  <div class="feature-style-1" tabindex="0" [title]="title">{{ title }}</div>
</div>

<div class="popup-section">
  @if (data?.attributes?.description) {
  <p class="trailer-1" [innerHTML]="$safeNavigationMigration(data.attributes?.description)"></p>
  } @if (data?.attributes?.Notes && isContentTheSame === false) {
  <p class="trailer-1" [innerHTML]="$safeNavigationMigration(data.attributes?.Notes)"></p>
  }

  <div class="button" tabindex="0" role="button" (click)="startDirections()">Directions To Here</div>
</div>
