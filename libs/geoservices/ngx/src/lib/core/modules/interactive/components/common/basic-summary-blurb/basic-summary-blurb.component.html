@if (showBlurb | async) {
<div class="info-block leader-1">
  <span class="material-icons-outlined close" title="Dismiss and don't show again" tabindex="0" role="button" (click)="dismiss()" (keydown.enter)="dismiss()" (keydown.space)="dismiss(); $event.preventDefault()">close</span>
  <p class="info-block__body">The following is a summarized list of the complete response. You can explore the full response <span class="faux-link" tabindex="0" role="button" (click)="emitNavigationRequest()" (keydown.enter)="emitNavigationRequest()" (keydown.space)="emitNavigationRequest(); $event.preventDefault()">here</span>.</p>
</div>
}
