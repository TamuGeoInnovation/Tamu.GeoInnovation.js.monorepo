<form [formGroup]="form">
  <div class="form-section">
    <div class="form-section-toolbar">
      <div class="form-section-name">
        <p>Contact Details</p>
      </div>
    </div>

    <div class="form-collection row">
      <tamu-gisc-textbox placeholder="First Name" formControlName="FirstName" [floatLabel]="true"></tamu-gisc-textbox>
      <tamu-gisc-textbox placeholder="Last Name" formControlName="LastName" [floatLabel]="true"></tamu-gisc-textbox>
    </div>

    <div class="form-collection row">
      <tamu-gisc-textbox placeholder="Email Address" formControlName="Email" [floatLabel]="true"></tamu-gisc-textbox>
      <tamu-gisc-textbox placeholder="Phone Number" formControlName="Phone" [floatLabel]="true"></tamu-gisc-textbox>
    </div>
  </div>
</form>
