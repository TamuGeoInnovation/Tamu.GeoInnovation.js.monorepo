<form [formGroup]="form">
  <div class="form-section">
    <div class="form-section-toolbar">
      <div class="form-section-name">
        <p>Billing Address</p>
      </div>
    </div>

    <div class="form-collection column">
      <tamu-gisc-textbox placeholder="Address 1" formControlName="Address1" [floatLabel]="true"></tamu-gisc-textbox>
    </div>

    <div class="form-collection column">
      <tamu-gisc-textbox placeholder="Address 2" formControlName="Address2" [floatLabel]="true"></tamu-gisc-textbox>
    </div>

    <div class="form-collection row">
      <tamu-gisc-textbox placeholder="City" formControlName="City" [floatLabel]="true"></tamu-gisc-textbox>
      <tamu-gisc-select [data]="states" [displayTemplate]="'name'" [valueTemplate]="'abbreviation'" formControlName="State"></tamu-gisc-select>
      <tamu-gisc-textbox placeholder="Zip" formControlName="Zip" [floatLabel]="true"></tamu-gisc-textbox>
    </div>
  </div>
</form>
