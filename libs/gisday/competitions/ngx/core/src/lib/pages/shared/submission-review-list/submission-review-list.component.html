<div class="submission-review-container">
  <ngx-datatable
    class="material"
    [rows]="submissions"
    [columnMode]="'flex'"
    [headerHeight]="50"
    [footerHeight]="50"
    [rowHeight]="'auto'"
    [scrollbarV]="true"
    [virtualization]="true"
    (activate)="onRowClick($event)"
  >
    <ngx-datatable-column name="Created" [flexGrow]="1">
      <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.created | date: 'short' }}
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Question" prop="questionValue" [flexGrow]="2">
    </ngx-datatable-column>

    <ngx-datatable-column name="Points" prop="pointValue" [flexGrow]="1">
    </ngx-datatable-column>

    <ngx-datatable-column name="Status" [flexGrow]="1">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <span [class]="'status-badge status-' + row.validationStatus">
          {{ row.validationStatus }}
        </span>
      </ng-template>
    </ngx-datatable-column>
  </ngx-datatable>
</div>
