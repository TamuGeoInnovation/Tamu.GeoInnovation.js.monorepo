<div class="submission-review-container datatable-container">
  <ngx-datatable class="material" [rows]="submissions" [columnMode]="'force'" [headerHeight]="50" [footerHeight]="50" [rowHeight]="40" [scrollbarV]="true" [virtualization]="true" [reorderable]="false" (activate)="onRowClick($event)">
    <ngx-datatable-column name="Created" [width]="200" [resizeable]="true">
      <ng-template let-row="row" ngx-datatable-cell-template> {{ row.created | date: 'short' }} </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="User" prop="resolvedIdentity" [width]="200" [resizeable]="true"> </ngx-datatable-column>

    <ngx-datatable-column name="Question" prop="questionValue" [width]="200" [resizeable]="true"> </ngx-datatable-column>

    <ngx-datatable-column name="Points" prop="pointValue" [width]="100" [resizeable]="true"> </ngx-datatable-column>

    <ngx-datatable-column name="SHA256" [width]="150" [resizeable]="true">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <span *ngIf="row.sha256Hashes && row.sha256Hashes.length > 0" [title]="row.sha256Hashes.join(', ')"> {{ row.sha256Hashes.length }} hash{{ row.sha256Hashes.length > 1 ? 'es' : '' }} </span>
        <span *ngIf="!row.sha256Hashes || row.sha256Hashes.length === 0">—</span>
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Status" [width]="120" [resizeable]="true">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <span [class]="'status-badge status-' + row.validationStatus"> {{ row.validationStatus }} </span>
      </ng-template>
    </ngx-datatable-column>
  </ngx-datatable>
</div>
