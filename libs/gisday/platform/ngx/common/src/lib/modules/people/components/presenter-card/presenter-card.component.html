<div class="presenter-item">
  @if (showActions) {
  <div class="presenter-actions">
    <span class="action material-icons" (click)="emitAction('delete')">cancel</span>
  </div>
  }

  <tamu-gisc-speaker-avatar [avatarImageUrl]="$safeNavigationMigration(speaker?.images?.[0]?.path)" [fallbackStyle]="'initials'" [avatarInitials]="speakerInitials"></tamu-gisc-speaker-avatar>

  <div class="details">
    <div class="name">
      <div>
        @switch (linkable) { @case (false) {
        <p>{{speaker.firstName}} {{speaker.lastName}}</p>
        } @default {
        <a [routerLink]="['/presenters', 'details', speaker.guid]"> {{speaker.firstName}} {{speaker.lastName}} </a>
        } }
      </div>
    </div>

    <div class="organization">{{speaker?.organization?.name}}</div>
  </div>
</div>
