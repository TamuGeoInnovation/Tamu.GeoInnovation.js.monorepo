<div class="profile" [routerLink]="['/presenters/details', speaker().guid]">
  <!-- On a photo only, never over the initials or the person icon (#2568). -->
  @if (avatar.showingPhoto()) {
  <tamu-gisc-speaker-class-banner [speaker]="speaker()"></tamu-gisc-speaker-class-banner>
  }

  <div class="avatar-container">
    <tamu-gisc-speaker-avatar #avatar [avatarImageUrl]="$safeNavigationMigration(speaker()?.images?.[0]?.path)"></tamu-gisc-speaker-avatar>
  </div>

  <div class="image-description">
    <div class="name" [title]="speaker().firstName + ' ' + speaker().lastName">{{speaker().firstName}} {{speaker().lastName}}</div>
    <div class="title" [title]="speaker()?.organization?.name ?? ''">{{speaker()?.organization?.name}}</div>
  </div>
</div>
