<div class="profile" [routerLink]="['/presenters/details', speaker().guid]">
  <tamu-gisc-speaker-class-banner [speaker]="speaker()"></tamu-gisc-speaker-class-banner>

  <div class="avatar-container">
    <tamu-gisc-speaker-avatar [avatarImageUrl]="$safeNavigationMigration(speaker()?.images?.[0]?.path)"></tamu-gisc-speaker-avatar>
  </div>

  <div class="image-description">
    <div class="name">{{speaker().firstName}} {{speaker().lastName}}</div>
    <div class="title">{{speaker()?.organization?.name}}</div>
  </div>
</div>
