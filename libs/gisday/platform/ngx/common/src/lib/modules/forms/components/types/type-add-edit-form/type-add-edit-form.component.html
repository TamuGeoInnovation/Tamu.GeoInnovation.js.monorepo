<form [formGroup]="form" (ngSubmit)="handleSubmission()">
  <div class="form-section">
    <div class="form-section-toolbar">
      <div class="form-section-title">{{ type() === 'create' ? 'Create' : 'Update' }} {{ page.title }}</div>
    </div>

    <div class="form-section-body">
      <div class="form-collection column pad-top">
        <tamu-gisc-textbox formControlName="type" [placeholder]="page.field" type="text" [floatLabel]="true"></tamu-gisc-textbox>
      </div>
    </div>
  </div>

  <div class="form-section">
    <div class="form-section-body">
      <div class="form-collection row">
        @if (type() === 'edit') {
        <tamu-gisc-button type="button" look="danger" [value]="'Delete ' + page.title" (click)="deleteEntity()"></tamu-gisc-button>
        }
        <tamu-gisc-button type="submit" [value]="type() === 'create' ? 'Create' : 'Update'"></tamu-gisc-button>
      </div>
    </div>
  </div>
</form>
