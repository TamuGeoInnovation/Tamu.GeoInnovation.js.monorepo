<!-- Wider than its box on a narrow screen, it scrolls there, with a scrollbar kept in view (#3029). -->
<tamu-gisc-dashboard-scroll class="dashboard-table-frame">
  <div class="datatable-container dashboard-table" [style.min-width.px]="minWidth()">
    <ngx-datatable class="material" [style.min-width.px]="minWidth()" [rows]="tableRows()" [columnMode]="'flex'" [headerHeight]="'auto'" [rowHeight]="'auto'" [footerHeight]="0" [scrollbarV]="false" [reorderable]="false" [summaryRow]="true" summaryPosition="bottom" [summaryHeight]="'auto'" [sorts]="sorts()" (sortsChange)="onSortsChange($event)" (activate)="onActivate($event)">
      <ngx-datatable-row-detail [rowHeight]="'auto'">
        <ng-template let-row="row" ngx-datatable-row-detail-template>
          <div class="dashboard-table-detail">
            @if (detail(); as template) {
            <ng-container *ngTemplateOutlet="template; context: { $implicit: row }"></ng-container>
            }
          </div>
        </ng-template>
      </ngx-datatable-row-detail>

      <ngx-datatable-column [name]="nameLabel()" prop="name" [flexGrow]="widths.name" [minWidth]="widths.name" [comparator]="compareNames" [summaryFunc]="totalName">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div class="dashboard-table-name" [attr.aria-expanded]="isOpen(row)">
            <span class="material-icons dashboard-table-chevron" aria-hidden="true">{{ isOpen(row) ? 'expand_less' : 'expand_more' }}</span>
            <span class="bold">{{ row.name }}</span>
          </div>
          @if (row.note) {
          <div class="dashboard-table-note">{{ row.note }}</div>
          }
        </ng-template>
      </ngx-datatable-column>

      @if (hasWhen()) {
      <ngx-datatable-column name="When" prop="when" [flexGrow]="widths.when" [minWidth]="widths.when" [comparator]="compareTimes" [summaryFunc]="blank">
        <ng-template let-row="row" ngx-datatable-cell-template>{{ row.when | date: whenFormat() : '-0600' }}</ng-template>
      </ngx-datatable-column>
      }

      <ngx-datatable-column [name]="totalHeading()" prop="total" [flexGrow]="widths.total" [minWidth]="widths.total" cellClass="dashboard-table-count bold" headerClass="dashboard-table-count" [summaryFunc]="sum"></ngx-datatable-column>

      @for (column of columns(); track column.key) {
      <ngx-datatable-column [name]="column.label" [prop]="countProp(column.key)" [flexGrow]="widths.count" [minWidth]="widths.count" cellClass="dashboard-table-count" headerClass="dashboard-table-count" [summaryFunc]="summaries().get(column.key)"></ngx-datatable-column>
      }
    </ngx-datatable>
  </div>
</tamu-gisc-dashboard-scroll>
