<div class="datatable-container dashboard-table">
  <ngx-datatable class="material" [rows]="tableRows()" [columnMode]="'force'" [headerHeight]="50" [rowHeight]="'auto'" [footerHeight]="0" [scrollbarV]="false" [reorderable]="false" [summaryRow]="true" summaryPosition="bottom" [summaryHeight]="'auto'" [sorts]="sorts()" (sortsChange)="onSortsChange($event)" (activate)="onActivate($event)">
    <ngx-datatable-row-detail [rowHeight]="'auto'">
      <ng-template let-row="row" ngx-datatable-row-detail-template>
        <div class="dashboard-table-detail">
          @if (detail(); as template) {
          <ng-container *ngTemplateOutlet="template; context: { $implicit: row }"></ng-container>
          }
        </div>
      </ng-template>
    </ngx-datatable-row-detail>

    <ngx-datatable-column [name]="nameLabel()" prop="name" [width]="280" [minWidth]="200" [comparator]="compareNames" [summaryFunc]="totalName">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <div class="dashboard-table-name" [attr.aria-expanded]="isOpen(row)">
          <span class="material-icons dashboard-table-chevron" aria-hidden="true">{{ isOpen(row) ? 'expand_less' : 'expand_more' }}</span>
          <span class="bold">{{ row.name }}</span>
        </div>
        @if (row.note) {
        <div class="dashboard-table-note">{{ row.note }}</div>
        }
      </ng-template>
    </ngx-datatable-column>

    @if (hasWhen()) {
    <ngx-datatable-column name="When" prop="when" [width]="170" [comparator]="compareTimes" [summaryFunc]="blank">
      <ng-template let-row="row" ngx-datatable-cell-template>{{ row.when | date: whenFormat() : '-0600' }}</ng-template>
    </ngx-datatable-column>
    }

    <ngx-datatable-column name="Total" prop="total" [width]="80" cellClass="dashboard-table-count bold" headerClass="dashboard-table-count" [summaryFunc]="sum"></ngx-datatable-column>

    @for (column of columns(); track column.key) {
    <ngx-datatable-column [name]="column.label" [prop]="countProp(column.key)" [width]="100" cellClass="dashboard-table-count" headerClass="dashboard-table-count" [summaryFunc]="sum"></ngx-datatable-column>
    }
  </ngx-datatable>
</div>
