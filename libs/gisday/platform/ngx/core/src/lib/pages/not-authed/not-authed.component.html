<section>
  <div class="small-partition">
    <div>
      <h1 class="trailer-1">{{ heading }}</h1>

      <div class="container12">
        @if (signedInAs$ | async; as who) {
        <p class="sub-section-heading">You are signed in as {{ who }}.</p>
        }
        <p class="sub-section-heading">{{ message }}</p>

        @if (links.length) {
        <p class="leader-1">
          @for (link of links; track link.to; let last = $last) {
          <a [routerLink]="link.to">{{ link.text }}</a>@if (!last) { · } }
        </p>
        }
      </div>
    </div>
  </div>
</section>
