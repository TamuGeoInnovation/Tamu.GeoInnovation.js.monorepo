<tamu-gisc-class-add-edit-form type="edit"></tamu-gisc-class-add-edit-form>

<div class="form leader-2">
  <div class="form-section">
    <div class="form-section-toolbar">
      <div class="form-section-title">Attendance</div>

      <div class="form-section-actions">
        @if ((isExporting$ | async) === false ) {
          <a (click)="exportCSV()">Export as CSV <span class="material-icons action">file_download</span></a>
        } @else {
          <div id="export-state">
            <p>Exporting...</p>
            <div class="loader"></div>
          </div>
        }

      </div>
    </div>

    <div class="form-section-body">
      <table>
        <thead>
          <th>Identifier</th>
          <th>Registered On</th>
        </thead>

        <tbody>
          @for (attendee of students$ | async; track attendee) {
            <tr>
              <td>{{ attendee.accountGuid }}</td>
              <td>{{ attendee.created | date: 'medium' }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
