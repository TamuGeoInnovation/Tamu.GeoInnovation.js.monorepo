<div class="legend-element">
  <!-- If there is only one legend element, don't apply a group title. Will apply the parent label on the
single child so that there aren't groups with a single child, because it will break the cleanliness
of the table -->
  <div class="element-parent-name" *ngIf="element.infos && element.infos.length > 1"><span class="material-icons">expand_more</span> {{ groupTitle }}</div>

  <!-- Switch through the different element types. The default is a "not supported" message printout. -->
  <ng-template #symbolTableMarkup>
    <div class="element-group">
      <div class="legend-info" *ngFor="let info of infos | async">
        <div [ngSwitch]="info.type">
          <!-- Support for infos with nested infos. This case will continue to recursively iterate through n-nested infos until reaching the last node. -->
          <div *ngSwitchCase="'symbol-table'">
            <tamu-gisc-legend-element *ngFor="let subInfo of info?.infos" [element]="subInfo" [layer]="layer" [groupTitle]="info.title"></tamu-gisc-legend-element>
          </div>

          <!-- This case will be reached of every info node and will terminate either with an info.preview or info.src -->
          <div *ngSwitchDefault>
            <ng-container [ngSwitch]="info.preview !== undefined">
              <div *ngSwitchCase="true" class="image-container" [elementInsert]="info.preview"></div>
              <img *ngSwitchCase="false" class="image-container" [src]="info.src" [ngStyle]="{opacity: info.opacity}" alt="Layer legend icon" />
            </ng-container>
          </div>
        </div>

        <!-- Apply labels only to leaf infos. Nested symbol-table nodes render labels in child components. -->
        <div *ngIf="info.type !== 'symbol-table'" [ngSwitch]="element.infos?.length">
          <div *ngSwitchCase="1" class="group-title">{{groupTitle}}</div>
          <div *ngSwitchDefault class="label">{{info?.label}}</div>
        </div>
      </div>
    </div>
  </ng-template>

  <ng-container [ngSwitch]="element.type">
    <!-- For SymbolTable element type -->
    <ng-container *ngSwitchCase="'symbol-table'" [ngTemplateOutlet]="symbolTableMarkup"></ng-container>

    <!-- Default printout -->
    <ng-container *ngSwitchDefault>
      <ng-container *ngIf="element?.infos?.length; else unknownLegendType" [ngTemplateOutlet]="symbolTableMarkup"></ng-container>
      <ng-template #unknownLegendType>
        <div *ngIf="useSportsSafetyFirstFallback(); else unsupportedLegendType" class="element-group">
          <div class="legend-info">
            <img class="image-container" [src]="getSportsSafetyFirstLegendSrc()" alt="Layer legend icon" />
            <div class="label">{{ getSportsSafetyFirstLegendLabel() }}</div>
          </div>
        </div>
        <ng-template #unsupportedLegendType>
          <div>Unsupported legend element type: {{element.type}}</div>
        </ng-template>
      </ng-template>
    </ng-container>
  </ng-container>
</div>
