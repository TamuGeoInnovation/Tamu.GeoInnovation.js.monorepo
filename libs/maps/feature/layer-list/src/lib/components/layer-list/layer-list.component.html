<div class="sidebar-component-name">
  @if (responsive?.isMobile) {
  <span class="material-icons" aria-label="Back" tabindex="0" role="button" (click)="backAction()" (keydown.enter)="backAction()" (keydown.space)="backAction(); $event.preventDefault()">arrow_back</span>
  }
  <p>Layers</p>
</div>

<div class="sidebar-component-content-container">
  @for (item of layers(); track item) {
  <tamu-gisc-layer-list-item [listItem]="item"></tamu-gisc-layer-list-item>
  }
</div>
