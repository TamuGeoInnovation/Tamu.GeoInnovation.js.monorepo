<div class="sidebar-component-name">
  @if (responsive?.isMobile) {
  <span class="material-icons" aria-label="Back" tabindex="0" role="button" (click)="backAction()" (keydown.enter)="backAction()" (keydown.space)="backAction(); $event.preventDefault()">arrow_back</span>
  }
  <p>Layers</p>
</div>

<div class="sidebar-component-content-container">
  @for (category of categories(); track category.item) {
  <div class="category">
    <tamu-gisc-accordion>
      <tamu-gisc-accordion-header>{{category.title}}</tamu-gisc-accordion-header>
      <tamu-gisc-accordion-content>
        <div>
          @switch (category.children.length) { @case (0) {
          <div>
            <tamu-gisc-layer-list-item [listItem]="category.item"></tamu-gisc-layer-list-item>
          </div>
          } @default {
          <div>
            @for (layer of category.children; track layer) {
            <tamu-gisc-layer-list-item [listItem]="layer"></tamu-gisc-layer-list-item>
            }
          </div>
          } }
        </div>
      </tamu-gisc-accordion-content>
    </tamu-gisc-accordion>
  </div>
  }
</div>
