<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Value</th>
    </tr>
  </thead>
  <tbody>
    <!-- With no sortFn, keyvalue sorts by key, as it did when the two cases were separate branches. -->
    @for (row of data() | keyvalue : sortFn(); track row.key) {
      <tr>
        <td>{{row.key}}</td>
        <td>{{row.value | json}}</td>
      </tr>
    }
  </tbody>
</table>
