<div class="sidebar-component-name">
  @if (isMobile | async) {
  <span class="material-icons" (click)="backAction()">arrow_back</span>
  }
  <p>Basemap</p>
</div>

<div class="sidebar-component-content-container">
  @if ((gallery | async); as gallery) {
  <div class="flex flex-column">
    @for (basemap of gallery.items; track basemap) {
    <div class="basemap flex flex-row align-center" [ngClass]="{active: gallery.activeBasemap.id === basemap.basemap.id}" (click)="selectBasemap(basemap)">
      <img [src]="basemap.basemap.thumbnailUrl" alt="Basemap thumbnail" />
      <p class="basemap-title">{{ basemap.basemap.title }}</p>
      @if (loadingBasemapId === basemap.basemap.id) {
      <div class="spinning-loader" aria-label="Loading basemap"></div>
      }
    </div>
    }
  </div>
  }
</div>
