<div class="travel-modes">
  <tamu-gisc-trip-planner-mode-toggle [activeModes]="[1, 2, 9, 10]" [iconName]="'directions_walk'" [name]="'Walking'" [label]="'Routing Mode: Walking'"></tamu-gisc-trip-planner-mode-toggle>

  <tamu-gisc-trip-planner-mode-toggle [activeModes]="[7]" [iconName]="'directions_bike'" [name]="'Biking'" [label]="'Routing Mode: Biking'"></tamu-gisc-trip-planner-mode-toggle>

  <tamu-gisc-trip-planner-mode-toggle [activeModes]="[3, 4, 8]" [iconName]="'directions_car'" [name]="'Driving'" [label]="'Routing Mode: Driving'"></tamu-gisc-trip-planner-mode-toggle>

  <tamu-gisc-trip-planner-mode-toggle [activeModes]="[5, 6]" [iconName]="'directions_bus'" [name]="'Bus'" [label]="'Routing Mode: Bus'"></tamu-gisc-trip-planner-mode-toggle>
</div>

<div class="options-container">
  <div>
    <!-- Trip from and to input components. By default, two blanks are automatically generated given that a trip has a minimum of two points -->
    @if ((isDev | async) === true) {
    <tamu-gisc-trip-planner-time-picker></tamu-gisc-trip-planner-time-picker>
    }
  </div>

  <!-- Shade-aware walking prototype, development only: prefer shade for the sun at the trip's time. -->
  @if ((isDev | async) === true && (isWalking | async) === true) {
  <tamu-gisc-checkbox class="shade-option" [checked]="(shade | async) === true" (changed)="setShade($event)" [label]="'Prefer shade'" [ariaLabel]="'Prefer shaded paths for the sun at the trip time'"></tamu-gisc-checkbox>
  }

  <div>
    <!-- Development only (#2801): Options offers only accessible routing, which the routing network does not support
    yet. Offer it everywhere again once the network routes accessible trips; its page is gated in map.routes.ts too. -->
    @if ((isDev | async) === true) {
    <p class="action bold" [routerLink]="['./options']">Options</p>
    }
  </div>
</div>
