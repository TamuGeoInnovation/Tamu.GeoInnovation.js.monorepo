<div class="popup-section">
  <div class="feature-style-1" tabindex="0">{{ data.attributes.Name }}</div>
  @if (data.attributes.Name !== 'Bonfire Memorial') {
  <div class="feature-style-2" tabindex="0">Bonfire Memorial</div>
  }
</div>

@if (medias?.length > 0) {
<div class="popup-section">
  <tamu-gisc-photo-carousel [photos]="medias"></tamu-gisc-photo-carousel>
</div>
}

<div class="popup-section">
  <div [innerHTML]="$safeNavigationMigration(data?.attributes?.Description)  | markdownParse" class="trailer-2"></div>

  <tamu-gisc-popup-footer [shareUrl]="shareUrl" (startDirections)="startDirections()"></tamu-gisc-popup-footer>
</div>
