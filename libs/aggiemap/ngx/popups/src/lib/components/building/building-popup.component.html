<div class="popup-section">
  <div class="feature-style-1" tabindex="0">{{ data.attributes.bldgname }}</div>
  @if (data.attributes.number) {
  <div class="feature-style-2" tabindex="0">Building {{ data.attributes.number }}</div>
  }
  <div class="feature-style-2" tabindex="0">
    @if ((data.attributes.address | trim | titlecase).length > 0) {
    <span>{{data.attributes.address | trim | titlecase}}, </span>
    }<span>{{data.attributes.city | trim | titlecase}}</span>, TX <span>{{data.attributes.zip | trim}}</span>
  </div>
</div>

<div class="popup-section">
  <tamu-gisc-popup-footer [shareUrl]="shareUrl" (startDirections)="startDirections()"></tamu-gisc-popup-footer>
</div>

<div class="popup-section">
  <div class="image" tabindex="0" aria-label="Image of feature">
    <img alt="" src="https://aggiemap.tamu.edu/images/compressed_test/{{ data.attributes.number }}.jpg" />
  </div>
</div>
