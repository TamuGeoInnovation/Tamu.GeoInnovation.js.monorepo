<div class="popup-section">
  <div class="feature-style-1" tabindex="0" [title]="title">{{ title }}</div>
</div>

<div class="popup-section" *ngIf="data?.attributes?.description || (data?.attributes?.Notes && isContentTheSame === false)">
  <p class="trailer-1" *ngIf="data?.attributes?.description" [innerHTML]="data.attributes?.description"></p>

  <p class="trailer-1" *ngIf="data?.attributes?.Notes && isContentTheSame === false" [innerHTML]="data.attributes?.Notes"></p>
</div>
