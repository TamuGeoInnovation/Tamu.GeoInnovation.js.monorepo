<div class="popup-section">
  <div class="feature-style-1" tabindex="0" [title]="$safeNavigationMigration(data?.layer?.id)">{{ data?.layer?.title }}</div>
  <div class="feature-style-2" tabindex="0">
    @if (data.attributes.Address) {
    <span>{{ data?.attributes?.Address }},</span>
    } College Station, TX 77843
  </div>
</div>

<div class="popup-section">
  <table>
    <thead>
      <tr>
        <th>Property</th>
        <th>Value</th>
      </tr>
    </thead>

    <tbody>
      @for (prop of (data.attributes | keyvalue); track prop) {
      <tr>
        <td>{{ prop.key }}</td>
        <td>{{ prop.value }}</td>
      </tr>
      }
    </tbody>
  </table>
</div>

<div class="popup-section">
  <!-- Copy URL component -->
  <!-- <copy [text]="shareUrl"></copy> -->

  <!-- Directions To Button -->
  @if (directionsAvailable | async) {
  <div class="button" tabindex="0" role="button" [attr.building-number]="data?.attributes?.Number" (click)="startDirections($safeNavigationMigration(data?.attributes?.Number))">Directions To Here</div>
  }
</div>
