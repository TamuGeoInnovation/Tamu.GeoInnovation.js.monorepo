<!-- Bus stop -->
<ng-container *ngIf="data.attributes.type !== 'route'">
  <div class="popup-section">
    <div class="feature-style-1" tabindex="0">{{ data.attributes.StopName || 'Bus Stop' }}</div>
    <div class="feature-style-2" tabindex="0"><strong>Served by route(s)</strong>: {{ data.attributes.Route }}</div>
    <div class="feature-style-2" tabindex="0" *ngIf="data.attributes.StopType === 'Time'"><strong>Timed Stop</strong></div>
  </div>

  <div class="popup-section">
    <!-- Copy link to this stop -->
    <tamu-gisc-copy-field [text]="shareUrl"></tamu-gisc-copy-field>

    <!--
      Directions To Here is deliberately absent. The routing service behind it is unpublished -
      /arcgis/rest/services/Routing returns an empty services list - so the button offers an action
      that cannot succeed. The two new 150th event maps shipped without it for the same reason.

      This is a local omission, not the fix. #1003 covers hiding every directions affordance behind
      a DirectionsEnabled flag, which is reversible in one line when routing returns; this popup is
      on its list. Restore the button by that flag rather than by pasting it back.
    -->

    <!--
      The shared `.button` rather than plain text: with the directions button gone this is the
      popup's only action, and it read as body copy.
    -->
    <a class="button" [href]="transportUrl" target="_blank" rel="noopener">View full schedule</a>
  </div>
</ng-container>

<!-- Route line -->
<ng-container *ngIf="data.attributes.type === 'route'">
  <div class="popup-section">
    <div class="feature-style-1" tabindex="0">Route {{ data.attributes.id }}: {{ data.attributes.routeName }}</div>
    <a class="button" [href]="transportUrl" target="_blank" rel="noopener">View full schedule</a>
  </div>
</ng-container>
