@if (medias.length > 0) {
<tamu-gisc-photo-carousel [photos]="medias"></tamu-gisc-photo-carousel>
}

<div class="popup-section"></div>

<div class="popup-section">
  @if (data?.attributes?.location) {
  <p class="trailer-1">{{ data.attributes.location }}</p>
  }

  <div [innerHTML]="$safeNavigationMigration(data?.attributes?.description) | markdownParse" class="trailer-2"></div>

  <!-- One labelled line, as every other popup shows a field (#2717): it was the only popup with a list. -->
  @if (amenities.length > 0) {
  <div class="feature-style-2 trailer-2" tabindex="0"><strong>Features</strong>: {{ amenities.join(', ') }}</div>
  }

  <tamu-gisc-copy-field [text]="shareUrl"></tamu-gisc-copy-field>

  @if (directionsAvailable | async) {
  <div class="button" (tamuGiscActivate)="startDirections()">Directions To Here</div>
  }
</div>
