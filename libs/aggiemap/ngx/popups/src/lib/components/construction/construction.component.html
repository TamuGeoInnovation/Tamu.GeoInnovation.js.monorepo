<div class="popup-section">
  <div class="feature-style-1" tabindex="0">{{ name }} Construction</div>
</div>

<div class="popup-section">
  <!-- Copy URL component -->
  <div class="feature-style-2" tabindex="0"><strong>Start Date</strong>: {{ startDate | date: 'longDate' }}</div>
  <div class="feature-style-2" tabindex="0"><strong>End Date</strong>: {{ endDate | date: 'longDate' }}</div>
  <div class="feature-style-2" tabindex="0" *ngIf="showContactName"><strong>Contact Name</strong>: {{ contactName }}</div>
  <div class="feature-style-2" tabindex="0" *ngIf="showContactInfo"><strong>Contact Info</strong>: {{ contactInfo }}</div>
  <div class="feature-style-2" tabindex="0"><strong>Notes</strong>: {{ notes }}</div>
</div>
