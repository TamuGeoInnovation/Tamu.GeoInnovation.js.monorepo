<swiper-container #swiperRef init="false">
  @for (media of medias; track media) {
  <swiper-slide [attr.data-src]="media">
    <a [href]="media" target="_blank">
      <img [src]="media" alt="Photo {{ $index + 1 }} of {{ medias.length }}, opens full size in a new tab" />
    </a>
  </swiper-slide>
  }
</swiper-container>

<div class="popup-section"></div>

<div class="popup-section">
  <div [innerHTML]="$safeNavigationMigration(data?.attributes?.description) | markdownParse" class="trailer-2"></div>

  <tamu-gisc-copy-field [text]="shareUrl"></tamu-gisc-copy-field>

  @if (directionsAvailable | async) {
  <div class="button" tabindex="0" role="button" (click)="startDirections()" (keydown.enter)="startDirections()" (keydown.space)="startDirections(); $event.preventDefault()">Directions To Here</div>
  }
</div>
