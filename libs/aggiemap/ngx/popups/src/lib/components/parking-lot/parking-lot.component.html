<!-- Shared with the garage popup. Lots are `lotname` on the campus features service; garages are `bldgname` on the
same service's Campus Structures since #3425. `LotName` is the retired raster basemap's field, kept last so a feature
still held from it renders rather than showing an empty heading (#1163). -->
<div class="popup-section">
  <div class="feature-style-1" tabindex="0">
    {{ data.attributes.lotname ?? data.attributes.bldgname ?? data.attributes.LotName }}
  </div>
  <div class="feature-style-2" tabindex="0">College Station, TX 77843</div>
</div>

<div class="popup-section">
  <tamu-gisc-copy-field [text]="shareUrl"></tamu-gisc-copy-field>

  <div class="button" (tamuGiscActivate)="startDirections()">Directions To Here</div>
</div>
