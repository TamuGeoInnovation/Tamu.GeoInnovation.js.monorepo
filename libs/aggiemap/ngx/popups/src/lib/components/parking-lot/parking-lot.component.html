<!-- Shared with the garage popup: lots come from the campus features service as `lotname`, garages from the old campus
basemap as `LotName`, until the garages have a counterpart (#2722). -->
<div class="popup-section">
  <div class="feature-style-1" tabindex="0">{{ data.attributes.lotname ?? data.attributes.LotName }}</div>
  <div class="feature-style-2" tabindex="0">College Station, TX 77843</div>
</div>

<div class="popup-section">
  <tamu-gisc-copy-field [text]="shareUrl"></tamu-gisc-copy-field>

  <div class="button" (tamuGiscActivate)="startDirections()">Directions To Here</div>
</div>
