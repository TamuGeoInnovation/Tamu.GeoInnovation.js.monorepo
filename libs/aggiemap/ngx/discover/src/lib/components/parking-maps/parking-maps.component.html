<div class="maps-page-shell">
    <tamu-gisc-maps-page-header
      title="Parking &amp; Transportation"
      intro="Browse the maps for getting around the Texas A&amp;M University campus and for parking on it."
    ></tamu-gisc-maps-page-header>

    <div class="maps-list-section trailer-3">
      <h2>Buses &amp; Transportation</h2>
      <tamu-gisc-aggiemap-map-columns [columns]="transportationColumns" [getApplicationRoute]="getApplicationRoute"></tamu-gisc-aggiemap-map-columns>
    </div>

    <div class="maps-list-section trailer-3">
      <h2>Parking</h2>
      <tamu-gisc-aggiemap-map-columns [columns]="columns" [getApplicationRoute]="getApplicationRoute"></tamu-gisc-aggiemap-map-columns>
    </div>
</div>

<tamu-gisc-footer></tamu-gisc-footer>
