<ng-container *ngIf="columns.length > 0; else noMaps">
  <div class="parking-columns">
    <!--
      `--titled` marks a column that is a real section rather than a layout split. On a phone
      the columns collapse into one list and their boundaries should disappear, but a titled
      one keeps its separation because its heading gives it meaning. Set here rather than
      inferred in CSS so it does not depend on `:has()`.
    -->
    <div class="parking-column" [class.parking-column--titled]="column.heading" *ngFor="let column of columns">
      <h2 class="parking-column-heading" *ngIf="column.heading">{{ column.heading }}</h2>

      <ul class="map-entry-list" *ngIf="column.applications.length > 0">
        <li class="map-entry-item" *ngFor="let app of column.applications">
          <!--
            A map that has a picture shows it in place of the glyph, so the listing shows what you are
            choosing between. This markup used to exist only on the All Maps page, which is a different
            component - so the Campus Maps page, the page the campus thumbnails were added for, drew a
            name over an empty area (#1275).
          -->
          <a class="map-entry" [class.map-entry--pictured]="app.thumbnail" [routerLink]="getApplicationRoute(app)">
            <img
              class="map-entry-thumbnail"
              *ngIf="app.thumbnail; else entryGlyph"
              [src]="app.thumbnail"
              [alt]="app.name + ' map'"
              loading="lazy"
            />
            <ng-template #entryGlyph><span class="map-entry-icon" aria-hidden="true"></span></ng-template>
            <span class="map-entry-label">{{ app.name }}</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</ng-container>

<ng-template #noMaps>
  <p class="section-description">{{ noMapsMessage }}</p>
</ng-template>
