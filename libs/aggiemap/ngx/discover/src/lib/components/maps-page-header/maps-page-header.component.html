<div class="breadcrumbs leader-2 trailer-1">
  <p><a routerLink="/map">Aggie Map</a></p>
  <!-- The parent crumb, and the one the phone layout turns into "< Back". -->
  <p class="breadcrumb-back"><a routerLink="/all-maps">All Maps</a></p>
  <p><a href="javascript:void(0)">{{ title }}</a></p>
</div>

<div class="dotted-divider trailer-2"></div>

<div class="maps-page-header-row leader-1 trailer-2">
  <div class="maps-page-header-titles">
    <h1 class="maps-page-title">{{ title }}</h1>
    @if (intro) {
      <p class="maps-page-intro">{{ intro }}</p>
    }
  </div>

  @if (showMainParking) {
    <a class="button maroon" [routerLink]="mainParkingRoute">Main Campus Parking Map</a>
  }
</div>
