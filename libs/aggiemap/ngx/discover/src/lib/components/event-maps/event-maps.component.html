<div class="maps-page-shell">
    <tamu-gisc-maps-page-header [title]="title" [intro]="intro"></tamu-gisc-maps-page-header>

    <div class="maps-list-section trailer-3">
      <ul class="event-links map-entry-list" *ngIf="applications.length > 0; else noEvents">
        <li class="event-link-item map-entry-item" *ngFor="let app of applications">
          <a class="map-entry" [routerLink]="getApplicationRoute(app)">
            <span class="map-entry-icon" aria-hidden="true"></span>
            <span class="map-entry-label">{{ app.name }}</span>
          </a>
        </li>
      </ul>

      <ng-template #noEvents>
        <div class="empty-state">
          <p>No event maps are available right now.</p>
        </div>
      </ng-template>
    </div>

    <tamu-gisc-quick-links [links]="quickLinks"></tamu-gisc-quick-links>
</div>

<tamu-gisc-footer></tamu-gisc-footer>
