<div class="container12 flex justify-center">
  <div class="column9 trailer-5">
    <div class="breadcrumbs leader-2 trailer-1">
      <p><a routerLink="/">Aggie Map</a></p>
      <p><a href="javascript:void(0)">Building Directory</a></p>
    </div>

    <div class="leader-1 trailer-2">
      <h1 class="long-border">Texas A&amp;M Building Directory</h1>
    </div>

    <form [formGroup]="form">
      <tamu-gisc-textbox formControlName="search" [placeholder]="'Type to filter buildings...'" [floatLabel]="true"></tamu-gisc-textbox>
    </form>

    <!-- Swimlane Datatable -->
    <div class="datatable-container">
      <ngx-datatable class="bootstrap" [rows]="_rows$ | async" [headerHeight]="50" [footerHeight]="50" [rowHeight]="40" [loadingIndicator]="loadingIndicator" [scrollbarV]="true" [scrollbarH]="true" [sorts]="[{ prop: 'BldgName', dir: 'asc' }]" [columnMode]="'force'">
        <ngx-datatable-column name="Name" prop="BldgName" [width]="350">
          <ng-template ngx-datatable-cell-template let-row="row">
            <a [routerLink]="['/']" [queryParams]="{ bldg: row.Bldg }" target="_blank" rel="noopener">{{ row.BldgName }}</a>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Number" prop="Bldg"></ngx-datatable-column>

        <ngx-datatable-column name="Abbreviation" prop="BldgAbbrev"></ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>
</div>

<tamu-gisc-footer></tamu-gisc-footer>
