<div [class.off-canvas-hidden]="hide()">
  <div id="top">
    <div class="action">
      <i class="material-icons" aria-label="Back" tabindex="0" role="button" (click)="returnBaseRoute()" (keydown.enter)="returnBaseRoute()" (keydown.space)="returnBaseRoute(); $event.preventDefault()">arrow_back</i>
    </div>
    <div class="points">
      <!-- On every environment since the routing network was published on production (#2804); development-only until then (#1003). -->
      @for (stop of stops | async; track $index; let i = $index) {
      <div>
        <input type="text" [placeholder]="'Search location'" [value]="stop?.attributes?.name ?? ''" (click)="summonOmnisearch(i)" />
      </div>
      }
    </div>
  </div>

  <div id="bottom">
    <tamu-gisc-trip-planner-mode-picker-mobile></tamu-gisc-trip-planner-mode-picker-mobile>
  </div>
</div>
