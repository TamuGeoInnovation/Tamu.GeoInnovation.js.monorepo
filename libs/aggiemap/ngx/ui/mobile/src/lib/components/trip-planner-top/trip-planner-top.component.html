<div [@offCanvasSlideUpFromTop]="hide()">
  <div id="top">
    <div class="action">
      <i class="material-icons" aria-label="Back" tabindex="0" role="button" (click)="returnBaseRoute()" (keydown.enter)="returnBaseRoute()" (keydown.space)="returnBaseRoute(); $event.preventDefault()">arrow_back</i>
    </div>
    <div class="points">
      <!-- Routing has no production service, so the planner is offered on development hosts only, for testing its components. -->
      @if (dev | async) { @for (stop of stops | async; track $index; let i = $index) {
      <div>
        <input type="text" [placeholder]="'Search location'" [value]="stop?.attributes?.name ?? ''" (click)="summonOmnisearch(i)" />
      </div>
      } } @else {
      <p class="maintenance-message">The Aggie Map routing services are currently undergoing maintenance and are unavailable. We apologize for the inconvenience while this work is underway.</p>
      }
    </div>
  </div>

  @if (dev | async) {
  <div id="bottom">
    <tamu-gisc-trip-planner-mode-picker-mobile></tamu-gisc-trip-planner-mode-picker-mobile>
  </div>
  }
</div>
