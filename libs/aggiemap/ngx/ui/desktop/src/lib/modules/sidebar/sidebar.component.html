<!-- The side panel of every map that has one: the main map and every event and parking map (#2758). Its tabs are
declared in `sidebar-tabs.ts`, and a map changes them only through `SIDEBAR_OPTIONS`. -->

<!-- `tamuGiscRevealSidebarOnPopup`: the feature popup renders inside this panel, so a closed panel
swallows it and clicking a feature appears to do nothing (#1244). -->
<tamu-gisc-sidebar [position]="'right'" tamuGiscRevealSidebarOnPopup>
  <div class="tabs left">
    @for (tab of tabs | async; track tab.id) {
    <tamu-gisc-sidebar-tab [title]="tab.title" [description]="tab.description" [material_icon]="tab.icon" [route]="tab.route" (click)="reportSidebarContent(tab.title)"></tamu-gisc-sidebar-tab>
    }
  </div>

  <div class="content">
    @if (options?.brandingIconUrl) {
    <img class="campus-branding-icon" [src]="options?.brandingIconUrl" [alt]="options?.brandingIconAlt ?? ''" />
    } @else {
    <tamu-gisc-tamu-block></tamu-gisc-tamu-block>
    }
    <router-outlet></router-outlet>
    <tamu-gisc-feature-popup></tamu-gisc-feature-popup>
  </div>
</tamu-gisc-sidebar>
