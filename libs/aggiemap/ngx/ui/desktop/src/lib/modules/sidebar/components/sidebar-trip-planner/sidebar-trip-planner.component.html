<div>
  <!-- On every environment since the routing network was published on production (#2804); development-only until then (#1003). -->
  <!-- Deferred so the planner's components stay out of the map's first download (#1650). -->
  @defer {
  <div>
    <!-- Trip from and to input components. By default, two blanks are automatically generated given that a trip has a minimum of two points -->
    @for (stop of stops | async; track $index) {
    <tamu-gisc-search (result)="setSearchResultAsTripStop($event)" (dirty)="eventClearRoute()" (empty)="eventClearStop($event)" [placeholder]="'Choose point or click on the map'" [canGeolocate]="true" [value]="stop?.attributes?.name ?? ''" [index]="stop.index" [rightActionIcon]="'close'"></tamu-gisc-search>
    }
  </div>

  <!-- The network picker is a tool for comparing routing networks, so development only (#2804). The application names one
  network (`routingNetworkUrl`), so elsewhere it would list a single technical name for nothing to choose. -->
  @if ((dev | async) === true) {
  <tamu-gisc-trip-planner-connection-select></tamu-gisc-trip-planner-connection-select>
  }

  <!-- Trip planner mode picker element. Sets the routing mode for the trip planner service.-->
  <tamu-gisc-trip-planner-mode-picker></tamu-gisc-trip-planner-mode-picker>

  <tamu-gisc-trip-planner-directions></tamu-gisc-trip-planner-directions>
  }
</div>
