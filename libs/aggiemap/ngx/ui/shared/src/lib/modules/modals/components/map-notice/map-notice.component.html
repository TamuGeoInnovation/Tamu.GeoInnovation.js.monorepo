<div class="map-notice-modal">
  <div class="map-notice-modal__header modal-body-spaced">
    <h2 class="map-notice-modal__title modal-title-centered">{{ title }}</h2>
  </div>

  <div class="map-notice-modal__body modal-body-spaced">
    <p>{{ message }}</p>
    @for (detail of details; track detail) {
      <p>{{ detail }}</p>
    }
  </div>

  <div class="map-notice-modal__footer modal-actions-centered">
    <tamu-gisc-button [value]="acknowledgeText" (click)="acknowledge()"></tamu-gisc-button>
  </div>
</div>
