<div class="event-passed-modal">
  <div class="event-passed-modal__header">
    <h2 class="event-passed-modal__title">{{ title }}</h2>
  </div>

  <div class="event-passed-modal__body">
    <p>{{ message }}</p>
  </div>

  <div class="event-passed-modal__footer">
    <button class="tamu-btn" (click)="acknowledge()">{{ acknowledgeText }}</button>
  </div>
</div>
