<!--
  The routes are rendered only where bus data is actually available. See `busRoutesAvailable` on the
  component: production reads bus data from the development GIS server until `TS/Bus_Routes` is
  published, so until then it keeps the notice it was already showing.

  Because the routes pipeline is cold, leaving this branch unrendered also means no request is made
  to that server.
-->
<ng-container *ngIf="busRoutesAvailable | async; else busRoutesUnavailable">
  <div *ngIf="(routes | async) === null" class="flex flex-column justify-center align-center leader-2 trailer-2">
    <div class="spinning-loader"></div>
  </div>

  <div class="group" *ngFor="let group of routes | async">
    <p class="group-name">{{ $any(group.identity).Name }}</p>

    <div class="routes">
      <tamu-gisc-bus-route *ngFor="let route of group?.items" [route]="route" [selection]="selectionAction"></tamu-gisc-bus-route>
    </div>
  </div>
</ng-container>

<ng-template #busRoutesUnavailable>
  <div class="bus-routes-notice leader-1 trailer-2">
    <span class="material-icons-outlined trailer-1">info</span>
    <p>Bus routes are currently unavailable on Aggiemap. We apologize for the inconvenience.</p>
    <p>
      Visit <a href="https://transport.tamu.edu/busroutes/?utm_source=aggiemap" target="_blank">Transportation Services</a> for
      bus routes.
    </p>
  </div>
</ng-template>
