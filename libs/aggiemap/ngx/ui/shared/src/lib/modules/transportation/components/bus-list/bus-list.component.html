@if ((routes | async) === null) {
<div class="flex flex-column justify-center align-center leader-2 trailer-2">
  <div class="spinning-loader"></div>
</div>
} @for (group of routes | async; track group) {
<div class="group">
  <p class="group-name">{{ $any(group.identity).Name }}</p>
  <div class="routes">
    @for (route of group?.items; track route) {
    <tamu-gisc-bus-route [route]="route" [selection]="selectionAction()"></tamu-gisc-bus-route>
    }
  </div>
</div>
}
