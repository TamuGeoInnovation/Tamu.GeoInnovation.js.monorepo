<div class="container-12">
  @if (isMobile) {
  <div class="close mobile" aria-label="Close" tabindex="0" role="button" (click)="close()" (keydown.enter)="close()" (keydown.space)="close(); $event.preventDefault()">
    <i class="material-icons" title="Close">arrow_back</i>
  </div>
  } @if (!isMobile) {
  <div class="close desktop" aria-label="Close" tabindex="0" role="button" (click)="close()" (keydown.enter)="close()" (keydown.space)="close(); $event.preventDefault()"><i class="material-icons" title="Close">close</i></div>
  }

  <router-outlet></router-outlet>
</div>

<tamu-gisc-backdrop [background]="'rgba(0,0,0,.5)'" [position]="'on-top'" (voidClick)="close()"></tamu-gisc-backdrop>
