<div class="container-12">
  @if (isMobile) {
    <div class="close mobile" (click)="close()">
      <i class="material-icons" title="Close">arrow_back</i>
    </div>
  }
  @if (!isMobile) {
    <div class="close desktop" (click)="close()"><i class="material-icons" title="Close">close</i></div>
  }

  <router-outlet></router-outlet>
</div>

<tamu-gisc-backdrop [background]="'rgba(0,0,0,.5)'" [position]="'on-top'" (voidClick)="close()"></tamu-gisc-backdrop>
