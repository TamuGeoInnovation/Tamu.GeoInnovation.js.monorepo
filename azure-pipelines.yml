variables:
  EXCLUDED_PROJECTS: 'geoservices-angular,geoservices-nest,gisday-angular,gisday-bridge-nest,gisday-competitions-angular,gisday-competitions-nest,gisday-nest,mailroom-angular,mailroom-helper-nest,mailroom-nest,oidc-admin-angular,oidc-admin-nest,oidc-provider-nest,signage-angular,ues-operations-angular,ues-operations-nest,aggiemap-ngx-core'
  IS_DEVELOPMENT: $[eq(variables['Build.SourceBranchName'], 'development')]
  IS_MASTER: $[eq(variables['Build.SourceBranchName'], 'master')]
  # Branches whose builds are deployed. Their artifacts must be complete, so they build
  # every non-excluded project rather than only the affected ones.
  IS_DEPLOYABLE: $[or(eq(variables['Build.SourceBranchName'], 'development'), eq(variables['Build.SourceBranchName'], 'master'))]
  ${{ if and(ne(variables['Build.SourceBranchName'], 'master'), ne(variables['Build.SourceBranchName'], 'development')) }}:
    AFFECTED_BASE: origin/development # Default affected base base
  ${{ if eq(variables['Build.SourceBranchName'], 'development') }}:
    AFFECTED_BASE: origin/development~ # Affected base if build branch name is development
  ${{ if eq(variables['Build.SourceBranchName'], 'master') }}:
    AFFECTED_BASE: origin/master~ # Affected base if build branch name is master
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    NX_BRANCH: $(System.PullRequest.PullRequestId) # You can use $(System.PullRequest.PullRequestNumber if your pipeline is triggered by a PR from GitHub ONLY)
    TARGET_BRANCH: $[replace(variables['System.PullRequest.TargetBranch'],'refs/heads/','origin/')]
  ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    NX_BRANCH: $(Build.SourceBranchName)
  HEAD_SHA: $(git rev-parse HEAD)

pool:
  # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 on 19 October 2026 (#1468); move on purpose.
  vmImage: 'ubuntu-24.04'

stages:
  - stage: Setup
    displayName: 'Setup'
    jobs:
      - template: templates/jobs/deltaConfigure.yml

  - stage: Dependencies
    jobs:
      - template: templates/jobs/cacheOrRestoreDependencies.yml

  - stage: Lint
    dependsOn:
      - Setup
      - Dependencies
    variables:
      baseSha: $[stageDependencies.Setup.Last_SHA.outputs['last_successful_sha.BASE_SHA']]
    jobs:
      - template: templates/jobs/lintProjects.yml

  - stage: Build
    dependsOn:
      - Setup
      - Dependencies
    variables:
      baseSha: $[stageDependencies.Setup.Last_SHA.outputs['last_successful_sha.BASE_SHA']]
    jobs:
      - template: templates/jobs/build.yml
        parameters:
          buildType: development
      - template: templates/jobs/build.yml
        parameters:
          buildType: production

  - stage: Tag
    dependsOn:
      - Setup
      - Build
    # Tagged everywhere it is possible: branch builds, and pull request builds whose branch is on
    # this repository. Skipped only for pull requests from a fork, where Azure DevOps gives the
    # build a deliberately restricted access token so that opening a pull request cannot make the
    # pipeline modify its own resources. `Edit build quality` is allowed here and still does not
    # apply to those runs.
    #
    # Attempting it on fork builds produced five "Access denied" warnings on every run, which left
    # the build status permanently amber and made the indicator worth ignoring.
    #
    # If a pull request build has no tags: push the branch to this repository rather than to a
    # fork. Working from a fork is the documented default (#1022), so most pull request builds
    # will not be tagged, and that is expected rather than broken.
    condition: |
      and(
        succeeded(),
        or(
          ne(variables['Build.Reason'], 'PullRequest'),
          eq(variables['System.PullRequest.IsFork'], 'False')
        )
      )
    variables:
      baseSha: $[stageDependencies.Setup.Last_SHA.outputs['last_successful_sha.BASE_SHA']]
    jobs:
      - template: templates/jobs/buildTags.yml
