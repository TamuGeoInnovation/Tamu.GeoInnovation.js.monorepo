jobs:
  - job: Last_SHA
    displayName: 'Last SHA'
    steps:
      # Set Azure Devops CLI default settings
      - bash: az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) project=$(System.TeamProject)
        displayName: 'Set default Azure DevOps organization and project'

      # Get last successful commit from Azure Devops CLI
      - bash: |
          LAST_SHA=$(az pipelines build list --branch $(Build.SourceBranchName) --definition-ids $(System.DefinitionId) --result succeeded --top 1 --query "[0].sourceVersion" | xargs)

          echo ""
          echo "==========="
          echo "$LAST_SHA"
          echo "==========="
          echo ""

          # Check if the last sha is not empty OR if the last sha is not a commit in the repo (as would be the case in the event of a rebase)
          if [ -z "$LAST_SHA" ]; then
            echo "Last successful commit SHA is empty. Using fallback affected base."
            LAST_SHA=$(AFFECTED_BASE)
          elif [ "$(git cat-file -t "$LAST_SHA")" != "commit" ]; then
            echo "Last successful commit SHA ($LAST_SHA) is not a commit in the repo. Using fallback affected base."
            LAST_SHA=$(AFFECTED_BASE)
          fi

          echo "Last successful commit SHA: $LAST_SHA"
          echo "##vso[task.setvariable variable=BASE_SHA;isOutput=true]$LAST_SHA"
        displayName: 'Get last successful commit SHA'
        name: 'last_successful_sha'
        env:
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

      # A pull request that changes only documentation skips Dependencies, Lint and Build, and the run still finishes
      # green (#1429). Only pull requests: a push to development starts no build here, and a hand-queued development
      # build is the deployable one, which always builds everything. A `pr:` path filter would do the same with less,
      # except that the required check `Monorepo` would then never report and the pull request could not merge.
      # HEAD is the pull request's merge commit, so HEAD^1 is the target branch; if that diff fails or is empty, the
      # script says to build. Command substitution uses backticks: Azure rewrites $(...) as its own variables.
      - bash: |
          set -u
          if [ "$(Build.Reason)" != "PullRequest" ]; then
            echo "Not a pull request ($(Build.Reason)): building."
            echo "##vso[task.setvariable variable=docsOnly;isOutput=true]false"
            exit 0
          fi
          FILES=`git diff --name-only HEAD^1 HEAD 2>/dev/null`
          if VERDICT=`echo "$FILES" | bash scripts/docs-only-change.sh`; then
            echo "##vso[task.logissue type=warning]Documentation only: Dependencies, Lint and Build are skipped (#1429)."
            echo "##vso[task.setvariable variable=docsOnly;isOutput=true]true"
          else
            echo "$VERDICT"
            echo "##vso[task.setvariable variable=docsOnly;isOutput=true]false"
          fi
        displayName: 'Is this pull request documentation only?'
        name: 'changes'

      # Where the heavy jobs run (#2212): on the lab's agents (pool Linux-Build) whenever useLab is true in
      # azure-pipelines.yml, and on the hosted pool when it is false. There is no automatic fallback: every pull
      # request here comes from a fork, and a fork build's restricted job token cannot list agent pools, so a check
      # of which agents are online sent every pull request to the hosted pool (build 5683, 23 October 2026). If the
      # lab is down, pull request builds wait for it; set useLab: false to send them to the hosted pool instead.
      - bash: |
          set -u
          hosted() {
            echo "##vso[task.logissue type=warning]Running on the hosted pool: $1"
            echo "##vso[task.setvariable variable=labOnline;isOutput=true]false"
            exit 0
          }

          [ "$(useLab)" = "true" ] || hosted "useLab is $(useLab) in azure-pipelines.yml."

          echo "useLab is true: the heavy jobs run on the lab (pool Linux-Build)."
          echo "##vso[task.setvariable variable=labOnline;isOutput=true]true"
        displayName: 'Choose the lab or the hosted pool'
        name: 'lab_pool'
