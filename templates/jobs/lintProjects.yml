# Instantiated twice: lab: true runs on the lab's agents when Setup found one online, lab: false on the hosted
# pool otherwise (#2212). Exactly one of the two runs; see azure-pipelines.yml.
parameters:
  - name: lab
    type: boolean
    default: false

jobs:
  - job: ${{ format('Lint_Affected{0}', iif(parameters.lab, '_lab', '')) }}
    displayName: ${{ format('Lint Affected{0}', iif(parameters.lab, ' on lab', '')) }}
    ${{ if parameters.lab }}:
      pool:
        name: Linux-Build
      condition: and(succeeded(), eq(stageDependencies.Setup.Last_SHA.outputs['lab_pool.labOnline'], 'true'))
    ${{ else }}:
      condition: and(succeeded(), ne(stageDependencies.Setup.Last_SHA.outputs['lab_pool.labOnline'], 'true'))
    steps:
      - ${{ if parameters.lab }}:
          - checkout: none
          - template: ../tasks/checkoutFromMirror.yml
      - template: ../tasks/cacheOrRestoreDependencies.yml
      - bash: |
          npx nx affected:lint --configuration=production --base=$(baseSha)  --exclude=$(EXCLUDED_PROJECTS) --parallel=2
        displayName: 'Lint Affected'
