# Weekly version updates (#2138). Security updates are separate and stay at GitHub's default (on).
#
# Every pull request targets development, the trunk; never master. Each one is handled like any dependency change
# (CLAUDE.md): its own issue, the full check with a clean npm ci, and the lock rule. A major version is the
# maintainer's decision, not merged on a green check alone.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    # Version updates wait for a release to age before they are proposed, against supply-chain attacks: most poisoned
    # releases are found and pulled within days (#2292). Security updates are not delayed; cooldown applies to version
    # updates only. 7 days for every kind of update, the same rule as our own upgrades (CLAUDE.md), so every pull request
    # Dependabot opens can be merged once it is green (#2333).
    cooldown:
      default-days: 7
    # One pull request per family, so a week brings a few rather than dozens. A package joins the first group that
    # matches it. The named families keep their majors in their group, because their packages move together;
    # everything-else takes minor and patch only, so each other major arrives as a pull request of its own.
    groups:
      angular:
        # The CLI's own packages are released with @angular/* and pin each other exactly, so they go in this group too:
        # in "everything-else" they arrived a pull request apart and the lock nested a second copy of each (#3253).
        # @angular/animations is deprecated on npm, so Dependabot never updates it, and every Angular update fails `npm ci`
        # on its exact peer until it is removed (#2278): move it by hand in the same pull request until then.
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - ng-packagr
          - '@angular-eslint/*'
          - angular-eslint
      nx:
        patterns:
          - nx
          - '@nx/*'
      nestjs:
        patterns:
          - '@nestjs/*'
      arcgis:
        patterns:
          - '@arcgis/*'
          - '@esri/*'
      testing:
        patterns:
          - 'jest*'
          - '@jest/*'
          - 'vitest*'
          - '@vitest/*'
          - '@playwright/*'
          # playwright itself, listed for tools/visual-baselines (#2122), moves with @playwright/test, which pins it exactly.
          - playwright
          - '@testing-library/*'
      lint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - typescript-eslint
          - '@typescript-eslint/*'
          - prettier
      everything-else:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # The Node type definitions stay at the runtime's major, Node 24 (node:24.22.3 everywhere), so code cannot use an API
    # that does not exist at run time. They move with the Node upgrade itself, as the images' Node major does (#2405).
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # amCharts stays at the version @arcgis/core depends on (~5.18.0 for 5.1.27), so the RSVP chart and ArcGIS share one
      # copy (libs/ui-kits/ngx/charts/README.md). A newer one installs a second copy under @arcgis/core (PR 3277). Move it
      # by hand, with an @arcgis/core upgrade that changes the version it depends on (#3288).
      - dependency-name: '@amcharts/amcharts5'

  # The four API images (node:24.22.3 and node:24.22.3-alpine), in one pull request.
  - package-ecosystem: docker
    directories:
      - /apps/gisday-nest/src
      - /apps/geoservices-nest/src
      - /apps/mailroom-nest/src
      - /apps/mailroom-helper-nest/src
    target-branch: development
    # Node majors come as their own change - builder stage, runtime stage, CI's setup-node and the dev containers
    # together - not a runtime-only bump (PR 2185 was closed for that, #2138). Patches and minors still come here.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    # Version updates wait 7 days after a release (#2292, #2333); security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      api-images:
        patterns:
          - '*'

  # The four front ends. Their FROM is the pinned nginx-base:sha-... tag, and Dependabot finds no newer sha- tags, which
  # is expected; they are listed so a later move to version tags is covered.
  - package-ecosystem: docker
    directories:
      - /apps/aggiemap-angular/src
      - /apps/gisday-angular/src
      - /apps/geoservices-angular/src
      - /apps/mailroom-angular/src
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    # Version updates wait 7 days after a release (#2292, #2333); security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      front-end-images:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    # Version updates wait 7 days after a release (#2292, #2333); security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
