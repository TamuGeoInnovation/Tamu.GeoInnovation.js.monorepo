name: AggieMap Smoke

# Runs against DEPLOYED environments, so it deliberately cannot gate a pull request: a failure here
# means an environment is unhealthy, not that a commit is bad.
#
# Development and production run as separate jobs rather than one combined run, because the two
# environments legitimately differ and a shared expectation would have to be loosened to the weaker
# of the two. Separate jobs also make the result diagnostic:
#
#   fails on production only   a back-end change broke production
#   fails on development only  the pending release is broken, or a dev-only service is missing
#   fails on both              a shared service or a layer definition is broken
#
# See #1034.
on:
  schedule:
    # 06:17 College Station. Cron is UTC with no daylight saving, so the local time shifts by an hour
    # twice a year, which does not matter for a daily health check. The offset minute avoids :00,
    # which is the most contended slot on GitHub's schedulers.
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check'
        required: true
        default: both
        type: choice
        options: [both, production, development]

# Needed to open, update and close the health issue below.
permissions:
  contents: read
  issues: write

concurrency:
  group: aggiemap-smoke
  cancel-in-progress: false

jobs:
  # Builds the job matrix so a manual run can target one environment. A scheduled run always does
  # both.
  setup:
    name: Select environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      # Each environment's settings live in test/smoke/aggiemap/environments.json, shared with
      # run-local.sh, so a run from a workstation checks exactly what the scheduled run checks.
      - name: Checkout repo
        uses: actions/checkout@v4

      - id: pick
        shell: bash
        run: |
          case "${{ github.event.inputs.environment || 'both' }}" in
            production)  selected='["production"]' ;;
            development) selected='["development"]' ;;
            *)           selected='["production","development"]' ;;
          esac

          matrix=$(jq -c --argjson selected "$selected" '
            . as $envs
            | { include: [ $selected[] as $name
                | $envs[$name]
                | { name: $name,
                    base_url: .baseUrl,
                    gtag: .gtag,
                    label: .healthLabel,
                    allowed_layer_failures: (.allowedLayerFailures | join(",")) } ] }
          ' test/smoke/aggiemap/environments.json)

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  smoke:
    name: ${{ matrix.name }}
    needs: setup
    runs-on: ubuntu-latest
    # Generous on purpose. A job that exceeds this is *cancelled*, not failed, and `if: failure()`
    # steps do not run on cancellation - so a slow failure would produce a red job and no issue,
    # which is the one outcome this workflow must not have.
    #
    # 120 since #1445. Runs took 25-43 minutes before the production framing baseline
    # (framing.spec.ts, 412 routes) joined the suite; that spec alone takes 40-47 minutes, and on
    # 5 October a production run was still going when 75 cancelled it. Expected now: 80-90 minutes.
    # This is headroom, not a fix: shortening the suite is #1426.
    timeout-minutes: 120

    strategy:
      # One unhealthy environment must not cancel the check on the other - knowing whether a failure
      # is on both is how the result is diagnosed.
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      AGGIEMAP_SMOKE_BASE_URL: ${{ matrix.base_url }}
      # Asserts the environment reports to its own Google Analytics property. Development served the
      # production measurement id until #1037; nothing noticed, and production's numbers absorbed
      # development traffic the whole time.
      AGGIEMAP_EXPECTED_GTAG_ID: ${{ matrix.gtag }}
      # Layers the development GIS server does not serve. Production serves all of them, so this is
      # empty there -- an entry appearing on production would be a real outage. Tolerated failures
      # are still listed in the test's annotations, so this suppresses noise without hiding anything.
      AGGIEMAP_SMOKE_ALLOWED_LAYER_FAILURES: ${{ matrix.allowed_layer_failures }}
      # Every framing route, not the one per map a release check opens from run-local.sh (#1426). The
      # daily run is where the ~360 builder-choice routes are still checked.
      AGGIEMAP_SMOKE_FRAMING: full

    steps:
      # The suite inspects each map through the map probe (window.__tamuGiscMapProbe). A deployed
      # build older than the probe cannot be checked at all: every map would wait out the probe,
      # fail, retry twice and report "deploy a newer build", taking 30+ minutes and holding a health
      # issue open until the next release. Skip instead, and say so. An environment that cannot be
      # reached is still a failure, so the report below still fires for a real outage.
      - name: Check the deployed build has the map probe
        id: probe
        shell: bash
        run: |
          base="${AGGIEMAP_SMOKE_BASE_URL%/}"

          # Accept: text/html, or the SPA fallback answers 404 (see the smoke README).
          html=$(curl -fsSL --max-time 60 -H 'Accept: text/html' "$base/") || {
            echo "::error::Could not load $base/"
            exit 1
          }

          # Every script the page references, not just the main bundle. Webpack kept the probe in
          # main.<hash>.js; the esbuild `application` builder (#1403) splits it into a chunk, and on
          # 5 October production carried it in chunk-V7S5FEPB.js while main-D6SZA4LL.js had none of
          # it. Reading one file made a present probe look absent and skipped the whole suite (#1435).
          scripts=$(printf '%s' "$html" | grep -oE '(src|href)="[^"]+\.js"' | sed -E 's/^(src|href)="//; s/"$//' | sort -u)
          if [ -z "$scripts" ]; then
            echo "::error::No scripts referenced by $base/, so the build cannot be checked for the map probe"
            exit 1
          fi

          found=false
          for script in $scripts; do
            case "$script" in
              http*) url="$script" ;;
              /*) url="$base$script" ;;
              *) url="$base/$script" ;;
            esac

            # Not `curl | grep -q`. Steps run under `set -o pipefail`, and `grep -q` exits the
            # moment it matches, so curl is left unable to write the rest and exits 23 - which
            # pipefail turns into a failed pipeline. The probe was found and the check still said
            # it was absent. Verified against production: the pipeline reports "Failure writing
            # output to destination", the same fetch without a pipe returns 786,629 bytes
            # containing the probe (#1435).
            body=$(curl -fsSL --max-time 120 "$url") || {
              echo "Could not fetch $script"
              continue
            }

            case "$body" in
              *__tamuGiscMapProbe*)
                echo "Map probe found in $script"
                found=true
                break
                ;;
            esac
          done

          if [ "$found" = true ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            count=$(printf '%s\n' "$scripts" | wc -l | tr -d ' ')
            message="The build deployed to ${{ matrix.name }} predates the map probe, so the smoke suite cannot check it. Searched $count script(s) referenced by $base/. Skipped; it runs again once a newer build is deployed."
            echo "::warning::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repo
        if: steps.probe.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.probe.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - uses: actions/cache@v4
        if: steps.probe.outputs.present == 'true'
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        if: steps.probe.outputs.present == 'true' && steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.probe.outputs.present == 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.probe.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        if: steps.probe.outputs.present == 'true'
        run: npx playwright test --config=playwright.aggiemap-smoke.config.ts

      # Only on failure. A healthy run should leave nothing behind but a green check.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aggiemap-smoke-${{ matrix.name }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      # Opens one issue per environment and keeps it updated, rather than filing a new one each day.
      # A layer that breaks on a Friday and is fixed the next Wednesday would otherwise produce five
      # identical issues, which is how a label stops being read.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # `--repo` explicitly: this step runs on failure, and when the failure happened before
          # `Checkout repo` there is no repository for gh to infer from. Without it the reporter dies
          # with "fatal: not a git repository" and hides the real failure entirely (#1435).
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label '${{ matrix.label }}' --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing on ${{ matrix.name }} (\`${{ matrix.base_url }}\`). [Run]($run_url)"
          else
            # `gh issue create` fails outright on a label that does not exist, which would break this
            # handler on the very first real failure. Created here so the workflow needs no manual
            # setup; harmless once it exists.
            gh label create --repo "$GITHUB_REPOSITORY" '${{ matrix.label }}' \
              --description 'A scheduled AggieMap smoke run is failing against this environment' \
              --color 'B60205' 2>/dev/null || true

            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "AggieMap smoke failing on ${{ matrix.name }}" \
              --label '${{ matrix.label }}' \
              --body "The scheduled smoke run is failing against \`${{ matrix.base_url }}\`.

          The report artifact on the run lists which maps failed and why. Layer failures generally mean a
          hosted service changed, rather than anything in this repository - see #1034 for what the suite
          checks and #1036 for an example.

          This issue is updated on each failing run and closed automatically when the run next passes.

          [Run]($run_url)"
          fi

      # Closes the issue once the environment recovers, so the open health issues describe the present
      # rather than accumulating as a history of resolved alarms. Only after the suite actually ran: a
      # skipped run (build without the probe) has checked nothing, so it must not close an issue.
      - name: Clear failure
        if: success() && steps.probe.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label '${{ matrix.label }}' --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Passing again on ${{ matrix.name }}. [Run]($run_url)"
          fi
