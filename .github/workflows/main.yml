name: Quabity Assuance

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

# Read-only for every job. Only `publish` writes packages, and it asks for that on its own job below.
permissions:
  contents: read

# A pull request's newer push supersedes its older one, so that run is cancelled. A push to a branch is a merge, and
# each merge's run finishes, with its own group per commit (#3531): cancelling them meant 73 of 99 runs on development
# were cancelled on 24 November, each one emailing whoever merged, and a merged commit could get no image. (A group
# with cancel-in-progress off would still cancel all but the newest waiting run, so the group itself is per commit.)
concurrency:
  group: qa-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  set-base:
    name: Set Base Reference
    runs-on: ubuntu-24.04

    # Run for any push; run for PRs only if they come from a fork
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)

    outputs:
      base: ${{ steps.set-base.outputs.base }}

    steps:
      - name: Set Base Reference
        id: set-base
        # A branch name is chosen by whoever pushes it, and a fork's by whoever opened the pull request, so it
        # reaches the script as an environment variable, never pasted into the script text (#2388).
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Determine the branch name for push or PR
          BRANCH="$REF_NAME"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="$HEAD_REF"
          fi

          if [[ "$BRANCH" == "development" || "$BRANCH" == "master" ]]; then
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            # For feature branches (including forks), compare against base repo's development
            echo "base=origin/development" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: set-base
    if: needs.set-base.result == 'success'
    uses: ./.github/workflows/lint.yml
    with:
      base: ${{ needs.set-base.outputs.base }}

  test:
    name: Test
    needs: [lint, set-base]
    if: needs.set-base.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      base: ${{ needs.set-base.outputs.base }}

  build:
    name: Build
    needs: [lint, set-base]
    if: needs.set-base.result == 'success'
    uses: ./.github/workflows/build.yml
    with:
      base: ${{ needs.set-base.outputs.base }}

  publish:
    name: Publish
    needs: [lint, test, build]
    # Usually you don't want to publish from fork PRs
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml

  # A failing run on development opens one issue, labelled development-health, or comments on the open one, and the next
  # passing run closes it, as the smoke suite's health issues do (#3531). That one place replaces an email per run, which
  # is what got ignored. A cancelled or skipped run says nothing either way: it has checked nothing.
  health:
    name: Development health
    needs: [lint, test, build, publish]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the development-health issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          PASSED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
          SHA: ${{ github.sha }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          short="${SHA:0:9}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label development-health --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ "$FAILED" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing at \`$short\`. [Run]($run_url)"
            else
              gh label create --repo "$GITHUB_REPOSITORY" development-health \
                --description 'The latest run on development is failing' --color 'B60205' 2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" --label development-health \
                --title "development is failing at $short" \
                --body "Quabity Assuance failed on \`development\` at \`$short\`. The run says which job and which task.

          A flaky test that fails on code it does not touch gets its own issue and a fix that day (CLAUDE.md, #3506).

          This issue is updated on each failing run and closed automatically when a run on development next passes.

          [Run]($run_url)"
            fi
          elif [ "$PASSED" = "true" ] && [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Passing again at \`$short\`. [Run]($run_url)"
          fi
