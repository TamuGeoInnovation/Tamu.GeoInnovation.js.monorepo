name: Lint Affected

on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string

jobs:
  lint:
    name: Affected
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'

      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Playwright strips types when it loads a spec, so nothing else fails on a type error in the
      # AggieMap smoke suite. A few seconds; runs on every pull request (#1470).
      - name: Typecheck the AggieMap smoke suite
        run: npx tsc -p test/smoke/aggiemap

      - name: Lint Affected
        run: npx nx affected:lint --configuration=production --base=${{ inputs.base }} --parallel=2
