name: Lint Affected

on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: Affected
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # `main.yml` says the base for a feature branch is "base repo's development", and in the base repository
      # `origin/development` is exactly that. **In a fork it is not**: `origin` is the fork, so the ref is whatever
      # that fork last synced. This team pushes every branch to a personal fork and nothing updates its
      # `development`, so on 25 November it was 1,079 commits behind and one ordinary branch read as changing 5,288
      # files instead of 6 - Prettier exited 249 and every push to a fork failed (#3557).
      #
      # Fetching over the ref rather than passing a different base keeps `$BASE` as `origin/development` for every
      # step that reads it, here and in `scripts/check-format.mjs`. The base repository is public, so this needs no
      # credentials, and on the base repository itself the step does not run.
      - name: Point origin/development at the base repository's, when this is a fork
        if: github.event.repository.fork
        env:
          # `parent` is present on a fork's push and pull_request payloads; the fallback is this repository's own
          # upstream, so the step still does the right thing if a payload ever arrives without it.
          UPSTREAM: ${{ github.event.repository.parent.full_name || 'TamuGeoInnovation/Tamu.GeoInnovation.js.monorepo' }}
        # One line, and no `${{ }}` in it, so `scripts/check-in-volume.sh` can read lint.yml's steps (#2286).
        run: git fetch --no-tags "https://github.com/$UPSTREAM.git" '+refs/heads/development:refs/remotes/origin/development'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.3'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Playwright strips types when it loads a spec, so nothing else fails on a type error in the
      # AggieMap smoke suite. A few seconds; runs on every pull request (#1470).
      - name: Typecheck the AggieMap smoke suite
        run: npx tsc -p test/smoke/aggiemap

      # The same for GIS Day's smoke suite (#3646).
      - name: Typecheck the GIS Day smoke suite
        run: npx tsc -p test/smoke/gisday

      # A new dependency with an install script must be reviewed into allowScripts first (#2293). .npmrc makes
      # `npm ci` refuse one too, but the step above is skipped when the node_modules cache hits; this reads the lock.
      - name: Check install scripts against allowScripts
        run: node tools/security-findings/install-scripts.mjs

      # Every registry package's signature, and its provenance where it has one, checked against the registry's
      # keys (#2293). About 15 seconds; fails on a missing or invalid signature. Tried again, up to three times, only
      # when the registry fails to answer (FETCH_ERROR), never for a signature that is wrong (#3439).
      - name: Check registry signatures
        run: node tools/security-findings/audit-signatures.mjs

      # Code deleted because the service it called went away, and expected back, lives on a parked/* tag. The
      # register, the tags and the parked issues have to agree, or the code is findable only by someone who already
      # knows it exists (#3704). Needs the tags, which the fetch-depth: 0 above provides.
      - name: Check the parked code register
        run: node scripts/check-parked-code.mjs

      # Every difference between the development and production GIS services is recorded in code as a
      # workaround, so nothing used to make anybody report it to the GIS team and about fifty accumulated
      # (#3402). Fails when a difference is in connections.ts and missing from the register.
      - name: Check the GIS service differences register
        run: node scripts/check-gis-differences.mjs

      # Files are LF but for one batch file, and with `* -text` in .gitattributes nothing else keeps them so: twelve had
      # drifted to CRLF or mixed before this step (#1025). A second or so.
      - name: Check line endings
        run: node scripts/check-line-endings.mjs

      # Only the files this pull request changes are checked: 433 files had drifted from Prettier by 24 November, and
      # reformatting them at once would conflict with every branch in flight, so each is formatted when it is next
      # touched (#1449, the maintainer's 2A). BASE is the pull request's base; without it, origin/development.
      - name: Check formatting of the changed files
        env:
          BASE: ${{ inputs.base }}
        run: node scripts/check-format.mjs

      # Spec files are run without their types being checked (vitest transpiles them; builds never use tsconfig.spec.json), so
      # a spec could be wrong about its types and pass: 3,993 errors in 16 projects on 25 November 2026 (#2263). Each project
      # the pull request changes has its spec configuration type-checked; the 16 are held to their counts until fixed.
      - name: Type-check the specs of the changed projects
        env:
          BASE: ${{ inputs.base }}
        run: node scripts/check-spec-types.mjs

      # A library with no build target is never compiled with its own tsconfig.lib.json, so a strict one could stop
      # compiling under its own rules unseen, as common-utils-string did on 25 November 2026 (#3581). Each strict library
      # the pull request changes is type-checked with it; the 8 that already fail are held to their counts.
      - name: Type-check the changed strict libraries with their own configuration
        env:
          BASE: ${{ inputs.base }}
        run: node scripts/check-strict-libs.mjs

      - name: Lint Affected
        env:
          BASE: ${{ inputs.base }}
        run: npx nx affected:lint --configuration=production --base="$BASE" --parallel=2
