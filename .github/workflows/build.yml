name: Build Affected

on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string

env:
  # ues-operations-angular builds (#1905). ues-operations-nest was excluded here because it needed
  # configuration kept outside the repository; it was deleted with the retired API (#2380).
  EXCLUDED_PROJECTS: 'gisday-bridge-nest,gisday-competitions-angular,gisday-competitions-nest,signage-angular'

permissions:
  contents: read

jobs:
  build:
    name: Affected
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: |
          set -euo pipefail

          # On a deployable branch this artifact is what gets published as container images:
          # the publish workflow builds its matrix from the Dockerfiles it finds inside it. So
          # an app that `affected` skipped produces no image, and its deployment keeps running
          # whatever it was already on. That is why aggiemap-angular sat on a tag built from a
          # pull request 645 days ago while its package still existed in the registry.
          #
          # Build every app that has a Dockerfile, derived rather than listed, so adding one is
          # all it takes for a new app to be built and published.
          if [ "${{ github.ref_name }}" = "development" ] || [ "${{ github.ref_name }}" = "master" ]; then
            PUBLISHABLE=$(find apps -name Dockerfile -not -path "*/node_modules/*" | cut -d/ -f2 | sort -u | paste -sd, -)

            if [ -z "$PUBLISHABLE" ]; then
              echo "::error::No app Dockerfiles found. The publish job would have nothing to build."
              exit 1
            fi

            echo "Deployable branch. Building every publishable app: $PUBLISHABLE"
            npx nx run-many --target=build --projects="$PUBLISHABLE" --configuration=production --parallel=2
          else
            echo "Validation build: affected projects only."
            npx nx affected:build --configuration=production --exclude=${{ env.EXCLUDED_PROJECTS }} --base=${{ inputs.base }} --parallel=2
          fi

      - name: Verify the artifact has something to publish
        if: github.ref_name == 'development' || github.ref_name == 'master'
        run: |
          set -euo pipefail

          COUNT=$(find dist/apps -name Dockerfile 2>/dev/null | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No Dockerfiles in dist/apps, so the publish job would skip and every image would go stale."
            exit 1
          fi

          echo "Images to be published: $COUNT"
          find dist/apps -name Dockerfile | cut -d/ -f3 | sort

      - name: Copy Files Needed For Image Build
        run: |
          mkdir -p dist
          cp -r package.json package-lock.json dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.sha }}
          path: dist/
          include-hidden-files: true
