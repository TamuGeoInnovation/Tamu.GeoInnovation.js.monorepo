name: Pull request title

# Titles are `type(project-name): Short description` (CONTRIBUTING.md, #1274). The squash merge makes the
# title the commit's first line on development, so it is the one part of a pull request that stays in the
# history for good. The rule is the one the repository already follows: 299 of the last 300 merged pull
# requests matched it on 24 November 2026.
on:
  pull_request:
    # `edited` matters: the fix is editing the title, and without it the check would stay red until a push.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Title follows type(project-name)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Prove the rule still works
        run: node .github/scripts/check-pr-title.mjs --self-test

      - name: Check this pull request's title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/check-pr-title.mjs

  # A pull request's drafted body (`.pr-body.md`) is for the person opening it and never belongs on development. On 24
  # November one reached it with PR 3561, and every branch drafting its own then conflicted with it (#3572). It is checked
  # here, on the pull request, and not in lint.yml: listeners commit their draft to their branch on purpose, and
  # scripts/check-in-volume.sh runs lint.yml's steps on those branches.
  no-drafted-body:
    name: No drafted body committed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The pull request does not add or change .pr-body.md
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | grep -qx '.pr-body.md'; then
            echo "This pull request adds or changes .pr-body.md, the drafted body. Remove it from the branch:"
            echo "  git rm .pr-body.md && git commit -m 'chore: Remove the drafted pull request body'"
            exit 1
          fi
          echo "No .pr-body.md in this pull request."
