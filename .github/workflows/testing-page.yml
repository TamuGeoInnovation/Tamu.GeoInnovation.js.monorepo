name: Testing Page

# docs/testing.md is what people outside the team are pointed at when they ask what testing this
# project does. A smoke spec it does not mention is testing nobody can see, so a new one fails here
# until the page describes it. See #1386.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'test/smoke/**'
      - 'docs/testing.md'
      - '.github/workflows/testing-page.yml'

permissions:
  contents: read

jobs:
  lists-every-spec:
    name: Lists every smoke spec
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check docs/testing.md names every smoke spec
        shell: bash
        run: |
          missing=0
          for spec in test/smoke/aggiemap/*.spec.ts; do
            name=$(basename "$spec")
            # In backticks, as the page writes it, so one name cannot pass as part of a longer one.
            if ! grep -qF "\`$name\`" docs/testing.md; then
              echo "::error file=docs/testing.md::$name is not mentioned in docs/testing.md. Add it to the smoke suite table, with its test count, what it catches and the issue behind it."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "docs/testing.md names every smoke spec."
          exit "$missing"

      # The map probe's global is named once, in map-probe.ts, as PROBE_GLOBAL (#2603). Six specs still typed it out
      # after that, and a missed one fails only when the suite next runs against a live site (#3473).
      - name: Check only map-probe.ts names the map probe
        shell: bash
        run: |
          found=$(grep -rlF '__tamuGiscMapProbe' test/smoke --include='*.ts' | grep -v '^test/smoke/aggiemap/map-probe\.ts$' || true)
          if [ -n "$found" ]; then
            while read -r file; do
              echo "::error file=$file::$file names __tamuGiscMapProbe. Import PROBE_GLOBAL from test/smoke/aggiemap/map-probe.ts instead."
            done <<< "$found"
            exit 1
          fi
          echo "Only map-probe.ts names the map probe."
