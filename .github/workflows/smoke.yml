name: GIS Day Smoke

# Runs against a DEPLOYED environment, so it deliberately cannot gate a pull request: a failure
# here means the deployment is unhealthy, not that a commit is bad. Scheduled, plus manual for
# checking a deploy immediately after it lands.
on:
  schedule:
    # Every 6 hours. Frequent enough to notice an outage, rare enough to stay quiet.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Environment to smoke test'
        required: false
        default: 'https://txgisday.org'
        type: string

# Nothing here writes to the repository. The workflow's token is read-only; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  smoke:
    name: Deployed
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url || 'https://txgisday.org' }}
        run: npx playwright test --config=playwright.smoke.config.ts

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
