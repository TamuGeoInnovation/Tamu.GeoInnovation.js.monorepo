name: Build and Publish Images

on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  list-publishable:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix || '[]' }}
    steps:
      - name: 'Download artifacts'
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}
      - name: 'Check for produced artifacts'
        id: check-apps
        run: |
          if [ -d "./apps" ]; then
            echo "✅ Apps directory found - proceeding with image build matrix generation"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️  Apps directory not found - skipping image builds"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 'Set matrix'
        id: set-matrix
        if: steps.check-apps.outputs.exists == 'true'
        # Run script to generate matrix by getting a list of all directories that have a dockerfile as json array in the /artifact directory
        run: |
          cd ./apps
          JASON=$(find . -name "Dockerfile" -exec dirname {} \; | sed 's/^\.\///' | jq -R -s -c 'split("\n")[:-1]')
          echo "$JASON"
          echo "matrix=$JASON" >> "$GITHUB_OUTPUT"
  build-and-push:
    needs: list-publishable
    runs-on: ubuntu-24.04
    if: ${{ needs.list-publishable.outputs.matrix != '[]' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJson(needs.list-publishable.outputs.matrix) }}
    steps:
      - name: 'Download artifacts'
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # `flavor: latest=true` was set here, which overrode the action's `latest=auto` default
          # and tagged *every* build as `latest`, including feature branches. Anything deployed
          # from `:latest` could therefore pick up unreviewed code the next time a pod was
          # recreated. Relying on the default means only the default branch gets the tag.
          # `stable` is the tag production deployments pin to. It used to be published from
          # `master` as well, but `master` was abandoned in 2022 and is hundreds of commits
          # stale, so a single stray push to it would have shipped four-year-old code to
          # production. Only `development` may produce `stable`. See issue #956.
          tags: |
            type=raw,value=stable,enable=${{ github.ref_name == 'development' }}
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_name != 'development' && github.ref_name != 'master' }}
            type=sha

      - name: Copy required image build files
        # An API's build writes its own package.json (generatePackageJson), so it gets the root files beside it as
        # root-package.json and root-package-lock.json: its image installs the root lock's versions, then prunes to its own
        # package.json (#2117). An app without its own package.json (the front ends) gets the root files as before.
        run: |
          app=apps/${{ matrix.image }}
          if [ -f "$app/package.json" ]; then
            cp package.json "$app/root-package.json"
            cp package-lock.json "$app/root-package-lock.json"
          else
            cp package.json package-lock.json "$app"
          fi

      # The gate (#2118). The image is built locally and scanned before anything is pushed, because
      # a critical that reaches the registry can be deployed, and pulling a tag back is not
      # something this pipeline can do. Only CRITICAL blocks: HIGH is reported daily by
      # `security-scan.yml`, and blocking on it would stop every publish over findings already
      # tracked and accepted.
      #
      # This job has no checkout - its workspace is the build artifact - so the accepted file and
      # the checker are fetched into a directory of their own, where they cannot collide with it.
      - name: Fetch the accepted advisories and the checker
        uses: actions/checkout@v7
        with:
          path: .security-gate
          sparse-checkout: |
            .github/security
            tools/security-findings
          sparse-checkout-cone-mode: false

      - name: Build the image without pushing it
        uses: docker/build-push-action@v7
        with:
          context: ./apps/${{ matrix.image }}
          push: false
          load: true
          tags: localhost/scan/${{ matrix.image }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            GIT_TAG=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            GIT_COMMIT=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}

      # Pinned, and the same version `security-scan.yml` uses: a gate whose scanner changes under
      # you reports different things on different days for the same image.
      - name: Scan it
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:0.76.1 image --scanners vuln --severity CRITICAL,HIGH \
            --format json --output /out/gate.json --quiet \
            "localhost/scan/${{ matrix.image }}:${{ github.sha }}"

      - name: Block a critical that is not accepted
        run: |
          node .security-gate/tools/security-findings/check.mjs \
            --accepted .security-gate/.github/security/accepted-advisories.json \
            --only-critical \
            --trivy "gate.json=${{ matrix.image }}"

      # Unchanged, and now reached only by an image that passed the gate. Its layers are already
      # built and cached by the step above, so this publishes rather than rebuilding.
      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: ./apps/${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            GIT_TAG=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            GIT_COMMIT=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
