name: Test Affected

on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string

env:
  EXCLUDED_PROJECTS: 'aggiemap-angular-e2e,geoservices-angular-e2e,gisday-bridge-nest,gisday-competitions-angular,gisday-competitions-angular-e2e,gisday-competitions-nest,mailroom-angular-e2e,oidc-admin-angular,oidc-admin-angular-e2e,oidc-admin-nest,oidc-provider-nest,signage-angular,signage-angular-e2e,ues-operations-angular,ues-operations-angular-e2e,ues-operations-nest'

jobs:
  test:
    name: Affected
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # --coverage=false: jest.preset.js sets collectCoverage globally, but the report is neither
      # uploaded nor checked against a threshold, so instrumenting every run is pure overhead.
      # Coverage is still available locally via `npm run coverage`.
      - name: Test Affected
        env:
          # Absolute, so every project writes into one place regardless of its depth.
          JEST_JUNIT_OUTPUT_DIR: ${{ github.workspace }}/test-results/junit
        run: npx nx affected:test --configuration=production --exclude=${{ env.EXCLUDED_PROJECTS }} --base=${{ inputs.base }} --parallel=2 --ci --coverage=false

      # Everything below runs even when the tests fail. A failing run is the one whose results are
      # worth reading, and the default `success()` condition would skip exactly those.

      - name: Summarise results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(test-results/junit/*.xml)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No JUnit output was produced. Either nothing was affected, or the reporter is not running." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Parsed with grep rather than a dependency: the attributes are on the <testsuite> element
          # and adding a parser here would be more to install and more to break than it saves.
          total=0; failures=0; errors=0; skipped=0; listed=0

          {
            echo "## Test results"
            echo
            echo "| Project | Tests | Failures | Skipped |"
            echo "| --- | ---: | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          for f in "${files[@]}"; do
            line=$(grep -o '<testsuites[^>]*' "$f" | head -1)
            [ -z "$line" ] && line=$(grep -o '<testsuite[^>]*' "$f" | head -1)

            get() { echo "$line" | grep -o "$1=\"[0-9]*\"" | head -1 | grep -o '[0-9]*' || echo 0; }

            t=$(get tests); fl=$(get failures); er=$(get errors); sk=$(get skipped)
            t=${t:-0}; fl=${fl:-0}; er=${er:-0}; sk=${sk:-0}

            total=$((total + t)); failures=$((failures + fl)); errors=$((errors + er)); skipped=$((skipped + sk))

            # The project name, from the file jest-junit wrote for it. Falls back to the `name`
            # attribute and then to the bare filename, so an unexpected shape degrades to something
            # readable rather than to nothing.
            name=$(basename "$f" .xml)
            case "$name" in
              junit.xml-*)
                attr=$(echo "$line" | grep -o 'name="[^"]*"' | head -1 | sed 's/name="//; s/"$//')
                [ -n "$attr" ] && [ "$attr" != "jest tests" ] && name=$attr
                ;;
            esac

            # 88 projects legitimately have no specs. A row of zeroes for each of them buries the
            # handful that ran, so they are counted in the total and left out of the table.
            if [ "$t" -eq 0 ]; then
              continue
            fi

            listed=$((listed + 1))
            mark=""
            [ $((fl + er)) -gt 0 ] && mark=" :x:"

            echo "| \`$name\`$mark | $t | $((fl + er)) | $sk |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$listed" -eq 0 ]; then
            echo "| _no project had any tests to run_ | 0 | 0 | 0 |" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo
            echo "**$total tests, $((failures + errors)) failed, $skipped skipped**, across $listed $([ "$listed" -eq 1 ] && echo project || echo projects) with specs."
            echo
            if [ $((failures + errors)) -gt 0 ]; then
              echo "See the **Test results** check for which tests failed and where."
            fi
            echo
            echo "_The XML is attached to this run as an artifact._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jest-junit-${{ github.run_id }}
          path: test-results/junit/
          retention-days: 14
          if-no-files-found: ignore
