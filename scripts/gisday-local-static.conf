# nginx settings for `scripts/gisday-local.sh web --static` (#2057): serves a build of gisday-angular
# from /site, and sends the front end's API calls to gisday-api, as proxy.local.json does for the dev
# server. nginx looks gisday-api up when it starts, so the `api` step must be running first.
server {
    listen 4201;
    root /site;
    index index.html;
    location /___ANGULAR_API_URL___/ {
        proxy_pass http://gisday-api:3333/api/;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
